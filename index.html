<style>/* ───────── 기본 ───────── */
*{box-sizing:border-box}/* 모든 요소의 크기 계산을 테두리 포함으로 */
html,body{margin:0;height:100%;background:#E9ECF1;font-family:'Malgun Gothic','맑은 고딕','Noto Sans CJK KR','Noto Sans KR',sans-serif;color:#000}/* 바탕·글꼴 */
[hidden]{display:none !important}/* hidden 속성은 항상 숨김 */
/* ───────── 상단 조작 막대 ───────── */
#bar{position:fixed;left:0;right:0;top:0;height:46px;background:#0C4270;color:#fff;display:flex;align-items:center;gap:8px;padding:0 12px;z-index:50;font-size:13px;white-space:nowrap;overflow-x:auto}/* 군청 막대 */
#bar .brand{font-weight:700;letter-spacing:.3px;margin-right:6px}/* 앱 이름 */
#bar .grp{display:inline-flex;align-items:center;gap:5px}/* 묶음 */
#bar .sp{flex:1}/* 남는 공간 */
#bar button,#bar select{height:30px;border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.12);color:#fff;border-radius:6px;padding:0 10px;font:inherit;cursor:pointer}/* 버튼·선택 상자 */
#bar select option{color:#000}/* 선택 목록 글자색 */
#bar button:hover{background:rgba(255,255,255,.28)}/* 마우스 올림 */
#bar button.pri{background:#fff;color:#0C4270;font-weight:700}/* 강조 버튼 */
#bar button.pri2{background:#5B84C4;border-color:#5B84C4;font-weight:700}/* PPT 버튼 */
#bar button.on{background:#fff;color:#0C4270}/* 켜진 토글 */
#bar .adm button{border-color:#FFD27A}/* 관리자 도구 강조선 */
.chip{min-width:26px;padding:0 6px !important}/* 쪽 칩 */
.chip.cur{background:#fff !important;color:#0C4270 !important;font-weight:700}/* 현재 쪽 칩 */
/* ───────── 슬라이드 영역 ───────── */
#viewport{position:fixed;left:0;right:0;top:46px;bottom:0;overflow:hidden;background:#E9ECF1}/* 슬라이드 영역 */
body.present #bar{display:none}/* 발표 중 막대 숨김 */
body.present #viewport{top:0;background:#000}/* 발표 중 검은 바탕 */
body.present.nocursor,body.present.nocursor *{cursor:none !important}/* 마우스가 멈추면 커서 숨김 */
#stage{position:absolute;left:0;top:0;width:1600px;height:1194px;transform-origin:0 0;background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.25);overflow:hidden}/* 고정 캔버스 */
#pageLayer,#masterLayer{position:absolute;inset:0}/* 겹쳐 놓는 층 */
#masterLayer{pointer-events:none}/* 마스터는 클릭 통과 */
.page{position:absolute;inset:0;background:#fff}/* 한 쪽 */
.page.t-fade{transition:opacity .45s ease}.page.t-push{transition:transform .5s ease}.page.t-zoom{transition:transform .5s ease,opacity .5s ease}/* 전환 효과 */
.el{position:absolute;display:flex;flex-direction:column;overflow:hidden}/* 요소 공통 */
.el .in{width:100%}/* 글 래퍼 */
.p{white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;line-height:1.14}/* 문단 */
.p.bul{padding-left:20.7px;text-indent:-20.7px}/* 글머리표 문단(0.13in) */
.p.bul::before{content:'•';display:inline-block;width:20.7px;text-indent:0}/* 글머리표 */
.el.step-hide{opacity:0;pointer-events:none}/* 단계 등장 전 숨김 */
.el{transition:opacity .35s ease}/* 단계 등장 효과 */
.el.editable{outline:2px dashed #E3262E;outline-offset:-2px;cursor:text}/* 편집 가능 칸(점선) */
.el.editable:focus{background:#FFFBE6}/* 편집 중 */
tr[data-go]{cursor:pointer}/* 요약표 행 클릭 이동 */
tr[data-go]:hover td{background:#F2F2F2}/* 요약표 행 마우스 올림 */
/* ───────── 발표 도구 ───────── */
#cover{position:absolute;inset:0;display:none;z-index:30}/* 검은/흰 화면 */
#laser{position:absolute;width:22px;height:22px;border-radius:50%;background:rgba(255,0,0,.75);box-shadow:0 0 14px 6px rgba(255,0,0,.45);display:none;z-index:31;pointer-events:none;transform:translate(-50%,-50%)}/* 레이저 점 */
#overview{position:absolute;inset:0;background:rgba(10,20,40,.94);display:none;z-index:32;overflow:auto;padding:24px;gap:18px;flex-wrap:wrap;align-content:flex-start}/* 목차 */
#overview.on{display:flex}/* 목차 표시 */
.ovCard{width:320px;cursor:pointer;color:#fff;font-size:13px;text-align:center}/* 목차 카드 */
.ovCard .th{width:320px;height:239px;background:#fff;position:relative;overflow:hidden;border:3px solid transparent;border-radius:4px}/* 썸네일 틀 */
.ovCard.cur .th{border-color:#FFD27A}/* 현재 쪽 */
#hud{position:absolute;left:0;right:0;bottom:0;height:22px;display:none;z-index:29;pointer-events:none}/* 진행 막대 영역 */
body.present #hud{display:block}/* 발표 중에만 */
#hudBar{position:absolute;left:0;bottom:0;height:4px;background:#5B84C4;width:0;transition:width .3s}/* 진행 막대 */
#hudNo{position:absolute;right:10px;bottom:6px;color:#bbb;font-size:12px}/* 쪽 번호 */
#measure{position:absolute;left:-99999px;top:0;width:1600px;height:1194px;visibility:hidden}/* 측정 영역 */
/* ───────── 토스트·모달 ───────── */
#toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);background:rgba(12,66,112,.96);color:#fff;padding:10px 18px;border-radius:8px;font-size:14px;z-index:99;opacity:0;pointer-events:none;transition:opacity .25s;max-width:80vw;white-space:pre-line;text-align:center}/* 안내 토스트 */
#toast.on{opacity:1}/* 토스트 표시 */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:80;display:flex;align-items:center;justify-content:center}/* 모달 바탕 */
.dlg{background:#fff;border-radius:10px;padding:18px 20px;max-height:90vh;overflow:auto;box-shadow:0 8px 40px rgba(0,0,0,.4);font-size:13px;min-width:340px}/* 모달 창 */
.dlg h3{margin:0 0 12px;font-size:16px;color:#0C4270}/* 모달 제목 */
.dlg label{display:block;margin:8px 0 3px;font-weight:700;font-size:12px;color:#333}/* 입력 라벨 */
.dlg input,.dlg textarea,.dlg select{width:100%;border:1px solid #bbb;border-radius:6px;padding:6px 8px;font:inherit}/* 입력 칸 */
.dlg textarea{min-height:64px;resize:vertical}/* 여러 줄 입력 */
.dlg .row{display:flex;gap:10px}.dlg .row>div{flex:1}/* 가로 배치 */
.dlg .btns{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}/* 버튼 줄 */
.dlg button{height:32px;padding:0 14px;border-radius:6px;border:1px solid #0C4270;background:#fff;color:#0C4270;cursor:pointer;font:inherit}/* 모달 버튼 */
.dlg button.pri{background:#0C4270;color:#fff}/* 모달 강조 버튼 */
.dlg .hint{color:#666;font-size:12px;margin-top:4px}/* 보조 안내 */
.dlg .chk{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px}/* 체크 목록 */
.dlg .chk label{display:inline-flex;align-items:center;gap:4px;margin:0;font-weight:400}/* 체크 라벨 */
.dlg .chk input{width:auto}/* 체크 입력 */
/* ───────── 편집 모드: 표 셀·문단 편집 칸 표시 ───────── */
td.editable,.p.editable{outline:2px dashed #E3262E;outline-offset:-2px;cursor:text}/* 표 셀·문단 점선 */
td.editable:focus,.p.editable:focus{background:#FFFBE6}/* 편집 중 배경 */
</style><!-- 스타일 삽입 위치 -->
</head>
<body><!-- 본문 -->
<div id="bar"><!-- 상단 조작 막대(발표 중에는 숨김) -->
  <span class="brand">6 Keys Weekly</span><!-- 앱 이름 -->
  <label class="grp">주차 <select id="weekSel" title="주차 아카이브"></select></label><!-- 주차 선택 -->
  <span class="grp" id="pageChips"></span><!-- 쪽 이동 칩 -->
  <button id="btnPrev" title="이전 (←)">◀</button><!-- 이전 쪽 -->
  <button id="btnNext" title="다음 (→)">▶</button><!-- 다음 쪽 -->
  <button id="btnPresent" class="pri" title="전체화면 발표 (F5 / F)">▶ 발표(F5)</button><!-- 발표 시작 -->
  <label class="grp">전환 <select id="transSel"><option value="fade">페이드</option><option value="push">밀기</option><option value="zoom">확대</option><option value="none">없음</option></select></label><!-- 전환 효과 -->
  <button id="btnStep" title="단계 등장 (S)">단계 등장: 꺼짐</button><!-- 단계 등장 토글 -->
  <button id="btnOv" title="목차 (O)">목차</button><!-- 목차 -->
  <button id="btnImgNow" title="지금 보고 있는 쪽을 PNG 이미지로 바로 저장">현재 쪽 이미지 저장</button><!-- 현재 쪽 이미지 즉시 저장 -->
  <button id="btnPng" title="현재 쪽 / 선택 쪽 / 전체 PNG 저장">PNG(선택·전체)</button><!-- PNG 저장 대화상자 -->
  <button id="btnCopy" title="현재 쪽 이미지 복사">이미지 복사</button><!-- 이미지 복사 -->
  <button id="btnPptx" class="pri2" title="PPT 저장">PPT 저장</button><!-- PPT 저장 -->
  <button id="btnPdf" title="전체 쪽을 PDF 한 파일로 저장 (회사 용지 25.517×19.05cm)">PDF 전체 저장</button><!-- PDF 전체 저장 -->
  <span class="sp"></span><!-- 오른쪽 정렬용 빈칸 -->
  <span id="adminGrp" class="grp adm" hidden><!-- 관리자 전용 도구(잠금 해제 후 표시) -->
    <button id="btnEdit" title="문구 편집 (E)">✏ 편집(E)</button><!-- 인라인 편집 -->
    <button id="btnItem" title="선택 품목 입력 창">품목 입력</button><!-- 품목 입력 창 -->
    <button id="btnSave" class="pri" title="시트에 저장">시트 저장</button><!-- 시트(GAS) 저장 -->
    <button id="btnNewWeek" title="새 주차 추가">새 주차</button><!-- 새 주차 -->
    <button id="btnJson" title="이 주차 JSON 내려받기">JSON</button><!-- JSON 내보내기 -->
    <button id="btnReload" title="시트에서 다시 불러오기">새로고침</button><!-- 다시 불러오기 -->
  </span>
  <button id="btnAdmin" title="관리자 모드">🔒 관리자</button><!-- 관리자 잠금/해제 -->
</div>
<div id="viewport"><!-- 슬라이드를 담는 영역 -->
  <div id="stage"><!-- 1600×1194 고정 캔버스(배율로 창에 맞춤) -->
    <div id="pageLayer"></div><!-- 쪽 본문(전환 대상) -->
    <div id="masterLayer"></div><!-- 마스터(구분선·장식, 전환 중에도 고정) -->
  </div>
  <div id="cover"></div><!-- B/W 화면 가리개 -->
  <div id="laser"></div><!-- 레이저 포인터 -->
  <div id="overview"></div><!-- 목차(쪽 카드) -->
  <div id="hud"><div id="hudBar"></div><span id="hudNo"></span></div><!-- 진행 막대·쪽 번호 -->
</div>
<div id="measure"></div><!-- 글 넘침 측정용(화면 밖) -->
<div id="toast"></div><!-- 한글 안내 토스트 -->
<div id="modalRoot"></div><!-- 모달 창 -->

진\n- PC 수요 약세\n- 중국 설비 재가동 계획\n- 한국 설비 보수·재가동\n- Nan Ya 장기보수\n- 높은 원료비", "outlook": "생산자 재고 압박이 크지 않고 장기보수 물량이 남아 있어 급락 가능성은 제한적이다. 다만 중국·한국 설비 재가동이 현실화되면 공급 부담이 커질 수 있어 연휴 후 PC·에폭시 가동률과 실제 재고보충 여부를 확인할 필요가 있다.", "additional_info": "- CFR China 평가범위 $1,520~1,620/mt\n- $1,620/mt 초과 오퍼에 구매자 반응 제한\n- 동중국 내수는 연휴 전 관망 속 보합\n- Nan Ya Mailiao No.4 장기보수 지속\n- Sinopec Sabic Tianjin No.3 10월 재가동 일정\n- Kumho P&B 여수 설비 일정이 공급 변수\n- LG Chem 여수 설비 보수·재가동 일정 존재\n- PC 가격 약세가 BPA 구매심리 제한", "daily_prices": [], "ai_outlook": "보합 전망. Nan Ya 장기보수와 생산자의 제한적인 현물 판매 의지는 중국 수입 BPA의 하단을 방어하는 요인이다. 그러나 Sinopec Sabic과 한국 설비의 재가동이 10월 중 현실화되면 공급은 점차 증가할 수 있으며 PC 시장의 약세가 지속되는 한 수요 측의 적극적인 재고보충도 기대하기 어렵다. 원료 상승이 BPA 오퍼에 반영되더라도 실제 거래가격에 전가되는지는 별도로 확인해야 한다. 연휴 후 PC·에폭시 가동률이 개선되지 않으면 $1,520/mt 하단 재시험 가능성이 있으나 공급 복귀가 지연될 경우 $1,600/mt대 유지가 가능한 균형 장세가 예상된다."}, "MMA": {"price": 1935, "prev_price": 1925, "change_abs": 10, "change_pct": 0.52, "commentary": "동남아향 1,000mt 대형 카고가 $1,950~1,960/mt에 거래되면서 500mt 이상 MMA 평가가격이 소폭 상승했다. 중국 국경절 전 고정가 거래는 많지 않았지만 역내 현물 오퍼가 제한적이고 일부 생산자의 판매 통제가 이어진 가운데 중국산 저가 오퍼가 상단을 제약하면서 상승으로 마감", "factors": "- 동남아 대형 카고 실거래\n- 역내 현물 오퍼 제한\n- 중국 생산자 판매 통제\n- 중국산 저가 오퍼\n- 중국 국경절 휴장\n- PMMA 수요 관망\n- 한국·대만 수입거래 제한\n- 소량 카고 가격 동반 상승", "outlook": "동남아 공급 제한은 가격 하단을 지지하지만 중국산 저가 오퍼 확대 가능성은 추가 상승을 제약한다. 연휴 후 중국산 물량의 실제 수출 체결 여부와 PMMA 구매 회복이 향후 방향을 결정할 전망이다.", "additional_info": "- 동남아향 1,000mt 거래 $1,950~1,960/mt\n- CFR Southeast Asia 500mt 이상 $1,910~1,960/mt\n- 한국·대만향 평가범위도 동반 상승\n- 중국산 10월 선적 오퍼 약 $1,850/mt FOB China\n- 이후 $1,780/mt FOB China 저가 오퍼도 시장에 언급\n- 한국산 MMA 약 $1,950/mt FOB Northeast Asia\n- 소량 카고도 대형 카고 가격 상승에 연동\n- PMMA 구매자는 고정가 거래보다 관망 우세", "daily_prices": [], "ai_outlook": "보합 전망. 동남아 대형 카고가 $1,950/mt 이상에서 성립한 점은 현물 공급이 넉넉하지 않고 일부 구매자가 필요물량을 확보하고 있음을 보여준다. 그러나 중국산 MMA가 $1,780~1,850/mt FOB China 수준에서 제시되기 시작해 연휴 후 이 물량이 실제 수출거래로 이어지면 역내 오퍼는 빠르게 조정될 수 있다. PMMA 수요가 뚜렷하게 회복되지 않는 한 구매자는 고가 물량을 선제적으로 확보하기보다 필요물량 중심으로 대응할 가능성이 높다. 동남아 공급 제약이 지속되면 $1,950/mt 재시험이 가능하지만 중국산 저가 물량이 확대되면 $1,900/mt 부근으로 조정될 수 있어 단기 보합 흐름이 예상된다."}}}, "2026-W41": {"week": "2026-W41", "as_of": "2026-10-09", "source": "261009 Google Drive weekly parsing; 6 core feedstocks. AN benchmark latest Platts assessment Oct 6.", "items": {"WTI": {"price": 91.85, "prev_price": 91.11, "change_abs": 0.74, "change_pct": 0.81, "commentary": "주초 G7의 원유·경유 비축유 1억 배럴 방출 결정과 중동 원유 수출 회복으로 공급 부족 우려가 완화되면서 WTI는 10월 5일 $89.43/b로 하락했으며, IEA의 신속한 비축유 방출 가능성이 부각된 7일에는 $88.28/b까지 추가 하락함. 그러나 8일 미국의 대이란 군사작전 재개 우려와 호르무즈 해협·페르시아만 유조선 피격, 멕시코만 허리케인에 따른 원유 생산 차질로 공급위험 프리미엄이 재확대되며 $91.49/b로 급반등함. 9일에도 해상운송 불안과 생산 차질이 가격을 지지했으나 미국의 이란 공격 유보 발언과 러시아산 경유 공급 확대 발표가 상승폭을 제한하면서 전주 대비 상승으로 마감", "factors": "- G7 원유·경유 비축유 총 1억 배럴 방출 결정\n- IEA의 신속한 비축유 방출 및 추가 공급 가능성\n- 중동 원유 수출 정상화와 사우디 동서 송유관 가동 확대\n- 호르무즈 해협 및 페르시아만 유조선 공격 지속\n- 미국 대이란 군사작전 재개 우려에 따른 지정학적 프리미엄 확대\n- 미국 멕시코만 허리케인에 따른 약 150만b/d 원유 생산 중단\n- 미국의 단기 대이란 공격 유보 발언에 따른 긴장 완화\n- 러시아산 경유 공급 확대 계획에 따른 정제제품 공급 우려 완화\n- 미국 원유재고 예상 밖 감소와 휘발유 재고 증가", "outlook": "G7과 IEA의 비축유 방출 및 중동 수출 회복은 공급 부족 우려를 완화하는 반면 호르무즈 해협의 해상운송 위험과 미국 멕시코만 생산 차질은 단기 가격 하단을 지지할 전망임. 러시아산 경유 공급 확대는 정제제품 시장의 가격 부담을 완화할 수 있으나 원유 공급 증가와는 구분할 필요가 있음. 지정학적 위험과 정책 대응이 상충하면서 WTI는 $89~94/b 중심의 높은 변동성을 동반한 보합권 흐름 전망", "additional_info": "- WTI 11월물은 10월 2일 $91.11/b에서 7일 $88.28/b까지 하락한 후 9일 $91.85/b로 반등했으며 주간 종가 기준 저점과 고점 차이는 $3.57/b\n- G7은 향후 약 4개월에 걸쳐 원유 및 경유 비축유 총 1억 배럴 방출에 합의했으며 IEA도 회원국들의 추가 방출 대응 능력을 강조\n- 10월 5일 Kpler 기준 중동 원유 수출 7일 이동평균은 1,830만b/d로 전쟁 이전 12개월 평균 1,800만b/d를 상회했으며 호르무즈 해협 수송량도 1,420만b/d로 회복\n- 10월 6일 사우디 동서 송유관 수송량은 약 580만b/d로 설계능력의 80% 이상 회복했으나 홍해 및 바브엘만데브 해상운송 위험은 지속\n- 10월 7일 EIA 기준 미국 상업용 원유재고는 320만 배럴 감소했으며 휘발유 재고는 약 38만2,000배럴 증가\n- 10월 8일 멕시코만 허리케인으로 약 150만b/d의 원유 생산이 중단됐으며 호르무즈 인근 유조선 공격 범위 확대에 WTI가 하루 $3.21/b 급등\n- 10월 9일 Brent 12월물은 $104.72/b로 전일 대비 $0.44/b 상승했으며 러시아산 경유 공급 확대 발표가 상승 제한 요인으로 작용", "daily_prices": [{"date": "10/2", "price": 91.11}, {"date": "10/5", "price": 89.43}, {"date": "10/6", "price": 89.44}, {"date": "10/7", "price": 88.28}, {"date": "10/8", "price": 91.49}, {"date": "10/9", "price": 91.85}], "ai_outlook": "보합 전망. WTI는 G7·IEA 비축유 공급 확대와 중동 수출 정상화가 하방 압력으로 작용하는 가운데 호르무즈 해협 유조선 공격과 미국 멕시코만 생산 차질이 공급위험 프리미엄을 유지하는 상충 구조로 판단됨. 10월 7일 $88.28/b까지 하락했던 가격이 이튿날 $91.49/b로 급반등한 것은 실제 공급 차질과 지정학적 위험이 단기간에 가격을 크게 변화시킬 수 있음을 보여줌. 그러나 미국의 단기 대이란 공격 유보와 러시아산 경유 공급 확대 발표를 고려하면 추가 상승에는 새로운 실질적 공급 차질이 필요할 가능성이 높음.\n\n단기적으로 $89~94/b 범위의 높은 변동성이 예상되며 멕시코만 생산시설 재가동과 중동 해상운송 정상화가 확인될 경우 $88~90/b 수준으로 재조정될 가능성이 있음. 반대로 호르무즈 해협 추가 유조선 피격으로 실제 통항량이 감소하거나 멕시코만 생산 중단이 장기화될 경우 $94~97/b 영역까지 위험 프리미엄이 재확대될 수 있음. 러시아산 경유 공급 계획은 원유 자체 증산이 아니라 정제제품 공급 확대라는 점에서 유가 하락 효과를 과대평가하지 않을 필요가 있음.\n\n향후 핵심 확인 변수는 호르무즈 해협 실제 원유 수송량, 멕시코만 150만b/d 생산 복구 속도, G7·IEA 비축유 실제 공급 시점, 러시아산 경유 선적 이행 여부 및 미국 원유재고 변화임. 석유화학 원료 구매 관점에서는 WTI 반등을 벤젠·SM·BD 동반 상승으로 직접 연결하기보다 나프타 가격과 스프레드, 아시아 개별 제품의 현물 수급 및 다운스트림 구매 저항을 별도로 확인할 필요가 있음."}, "Styrene": {"price": 1428, "prev_price": 1369, "change_abs": 59, "change_pct": 4.31, "commentary": "중국 국경절 연휴 기간 유지됐던 저재고와 SM 생산업체의 제한적인 가동률에 원유·벤젠 가격 급등이 더해지면서 8일 아시아 SM 가격이 큰 폭으로 상승함. 중국 화동 현물시장은 연휴 직후 EB 선물 강세와 재고보충 기대에 높은 호가를 형성했으나 9일에는 선물가격 조정과 고가격 구매 저항으로 상승세가 둔화됨. 공급 측면에서는 높은 벤젠 원가와 낮은 생산마진으로 SM 설비의 가동 확대가 제한됐으며 중국 내 현물 가용물량도 부족한 상태를 유지함. 다만 EPS·PS·ABS의 원료비 부담이 커지고 중국 SM 수출가격의 변동성이 확대되면서 거래가 위축돼 전주 대비 상승으로 마감", "factors": "- 중국 국경절 이후 EB 선물 강세와 현물가격 반등\n- 벤젠 및 원유가격 급등에 따른 SM 생산원가 상승\n- 중국 SM 저재고와 제한적인 현물 공급\n- SM 생산업체 낮은 가동률과 수익성 악화\n- 중국 화동지역 재고보충 수요 유입\n- 중국 SM 수출가격 변동성 확대와 거래 위축\n- EPS·PS·ABS 다운스트림 마진 악화\n- 중국 연휴 이후 최종수요 회복 불확실성\n- 중국 선물가격 조정과 높은 원료가격에 대한 구매 저항", "outlook": "중국의 낮은 SM 재고와 제한적인 생산 확대, 벤젠 원가 상승은 가격을 지지할 전망이나 고가격에 대한 다운스트림 구매 저항으로 추가 상승폭은 제한될 가능성이 있음. 특히 중국 EPS·PS 생산업체의 가동률 저하와 ABS 수익성 악화는 원료 구매 확대를 제약하는 요인임. 수급상 공급 부족이 유지되더라도 실제 구매량이 증가하지 않으면 가격은 급등 이후 조정될 수 있음. 단기적으로 보합 내지 강보합의 높은 변동성 전망", "additional_info": "- SM CFR China는 10월 2~7일 $1,369/mt를 유지했으며 8일 $1,449/mt로 급등한 뒤 9일 $1,428/mt로 조정\n- 10월 8일 벤젠 원가 상승과 EB 선물 강세, 낮은 현물재고가 동시에 반영되며 중국 연휴 이후 급등\n- 중국 국내 SM 재고는 낮은 수준을 유지하며 높은 원가 부담으로 생산업체의 설비 가동 확 국 MMA 생산설비 낮은 가동률\n- 중국 내수 MMA 가격 일부 상승\n- PMMA 생산업체 마진 악화와 구매 저항\n- 중국 연휴 이후 제한적인 재고보충 수요\n- 중동 지정학적 위험에 따른 원료가격 변동성", "outlook": "한국과 대만의 제한적인 현물 공급, 높은 원료가격 및 중국 MMA 생산설비의 낮은 가동률은 수입가격을 지지할 전망임. 다만 중국 내 다운스트림 업체들이 계약물량 중심으로 구매하고 PMMA 생산마진도 부진해 가격 인상에 대한 수용력은 제한적임. 중국 연휴 이후 신규 협상이 재개되더라도 수급 개선이 확인되기 전까지는 보합권을 벗어날 가능성이 낮으며 단기적으로 안정적인 가격 흐름 전망", "additional_info": "- MMA CFR South Korea 500mt 이상 평가범위는 $1,910~1,960/mt이며 중간가격 $1,935/mt로 전주와 동일\n- CFR Taiwan 및 CFR Southeast Asia 500mt 이상도 각각 $1,935/mt로 보합\n- 20~300mt 소량 화물 기준 CFR Southeast Asia는 $2,010~2,060/mt, 중간가격 $2,035/mt로 유지\n- 중국산 10월 선적 MMA 판매의향은 10월 8~9일 기준 FOB China 약 $1,850/mt\n- 중국 화동 Ex-Tank MMA 내수가격은 13,100~13,200위안/mt로 전주 대비 하단 100위안 상승\n- 중국 화남 Delivered MMA 가격은 13,400~13,700위안/mt로 전주 대비 상·하단 각각 100위안 상승\n- 중국 MMA 주간 평균 가동률은 약 53%로 낮은 수준\n- 한국 투명 ABS 관련 MMA 수요가 현물 수출 공급을 제한하고 대만산 10~11월 초 선적 오퍼도 제한", "daily_prices": [], "ai_outlook": "보합 전망. 아시아 MMA 시장은 공급업체의 낮은 재고와 제한적인 수출 가능 물량, 원료가격 상승이 가격 하단을 지지하는 반면 중국 PMMA 및 기타 다운스트림 수익성 악화가 추가 상승을 제한할 것으로 판단됨. 특히 중국 MMA 생산설비 평균 가동률이 약 53%에 머물고 있다는 점은 공급 확대가 제한적임을 보여주지만 동시에 수요업체들이 적극적으로 신규 구매를 확대하지 못하는 상황도 반영하고 있음. 중국 내수가격의 소폭 상승이 수입시장 가격 인상으로 이어지려면 연휴 이후 재고보충이 실제 거래량 증가로 확인돼야 함.\n\n단기적으로 CFR South Korea는 $1,910~1,970/mt 범위에서 보합권 움직임이 예상되며 한국·대만 수출 가능 물량이 추가 감소하거나 원료가격이 상승하면 상단 확대 가능성이 있음. 반면 중국 PMMA 업체 마진 악화와 신규 구매 부진이 장기화되면 가격 인상 시도가 수용되지 않을 수 있음. 핵심 확인 변수는 중국 MMA 설비 가동률, 화동·화남 내수가, 한국·대만의 현물 수출 가능 물량, PMMA 수익성과 국경절 이후 거래량임."}}}, "2026-W42": {"week": "2026-W42", "as_of": "2026-10-16", "source": "261016 Platts Oct 16 DailyDetail image for WTI, SM CFR China, BD CFR China; Platts Oct 13 commentary for AN CFR FEA; ICIS Oct 16 BPA and MMA supply/demand and benchmark.", "items": {"WTI": {"price": 101.41, "prev_price": 91.85, "change_abs": 9.56, "change_pct": 10.41, "commentary": "WTI는 주초부터 호르무즈 해협 운송 불안과 사우디 에너지 시설 공격 우려, 러시아 정유시설 관련 공급 위험이 겹치며 매수세가 강화돼 12일 $93.74/b에서 15일 $97.97/b로 꾸준히 상승했고, 주중 미국 원유재고 감소까지 공급 불안 심리를 자극한 가운데 G7·IEA 비축유 방출 기대와 사우디 우회수출 회복 가능성이 상승폭을 일부  South Korea가 $1,915/mt로 내려 하락으로 마감", "factors": "- 중국산 수출 오퍼 인하\n- 중국 내수가의 주간 하락\n- 한국·대만 수입 구매 부진\n- 동남아 수요자의 신중한 조달\n- 원료 부족과 높은 제조원가\n- 중국 53% 가동률에 따른 공급 제약", "outlook": "중국 MMA 가동률이 원료 부족으로 53%에 머물지만 중국산 11월 수출 오퍼가 낮아지면서 500mt 이상 한국향 수입가격을 압박함. 한국·대만 수입이 한산하고, FOB·CFR 가격 차이를 할인폭으로 볼 수 없음. 중국 내수가 회복과 대형 성약 증가가 확인되면 보합 전환이 가능하지만 연말 관망과 중국산 경쟁이 이어지면 추가 약세가 우세할 전망.", "additional_info": "- 500mt 이상 CFR South Korea 범위 $1,890~1,940/mt\n- Mid $1,915/mt, 주간 변화 -$20/mt\n- 중국산 11월 선적 오퍼 $1,800/mt FOB China\n- 한국 11월 선적 약 500mt가 $1,850/mt FOB에 거래된 것으로 전해짐\n- 동남아 500mt 미만 협상은 높은 $1,900대~$2,000/mt 부근\n- 중국 MMA 평균 주간 가동률 53%\n- 한국·대만은 수입 활동보다 수출 논의가 관찰됨", "daily_prices": [], "ai_outlook": "하락 전망. 중국 내수가 약세가 수출 오퍼 인하로 전달되고 한국·대만의 수입 구매도 한산해 500mt 이상 MMA 카고는 저가 대체물량의 압력을 받을 것으로 판단됨. 원료 부족과 높은 제조원가로 중국 가동률이 53%에 머물러 공급 자체는 제한돼 있지만 구매자가 재고를 미리 확보할 필요를 느끼지 않으면 공급 감축이 바로 평가가격 상승으로 연결되지는 않는 구조임. 중국산 11월 선적 FOB 오퍼와 한국향 CFR 대형 카고는 운임과 인도조건이 달라 차액을 그대로 할인폭으로 적용할 수 없으며, 한국의 FOB 수출 거래도 수입 수요 회복의 증거와 구별해야 함. 중국 내수가 반등이 수출 성약에 이어지고 공급 제한이 심화되면 보합으로 수정할 수 있지만 연말 결산을 앞둔 구매 축소와 중국산 경쟁이 계속되면 추가 약세가 가능함. 상승 전환에는 유도품 주문 회복과 같은 규모의 대형 거래 인상이 함께 필요하며 중국 가동률·FOB 오퍼·한국향 대형 성약과 PMMA 구매가 핵심 지표임."}}}, "2026-W44": {"week": "2026-W44", "as_of": "2026-10-30", "source": "10/26-10/30 Platts DailyDetail images (WTI Dec NYMEX, SM CFR China, BD CFR China); Platts ACN CFR Far East Asia 10/27 Weekly; ICIS 10/30 BPA CFR China Spot and MMA >=500mt CFR South Korea; ICIS 10/30 Styrene Asia and BD Asia reports for commentary", "items": {"WTI": {"price": 104.12, "prev_price": 103.27, "change_abs": 0.85, "change_pct": 0.82, "commentary": "WTI 12월물은 주초 중동 외교협상 재개 기대와 지정학적 위험 프리미엄 축소로 26일 $101.76/b, 27일 $99.90/b까지 밀렸지만, 28일 중동 공급 불안과 미국 원유재고 감소 우려로 $102.78/b까지 반등했으며 29일 다시 조정받은 뒤 주 후반 호르무즈 해협 유조선 공격과 사우디 에너지시설 위협, 리비아 송유관 차질 우려가 재부각되면서 30일 $104.12/b로 올라 전주 대비 상승으로 마감", "factors": "- 주초 중동 외교협상 기대에 따른 위험 프리미엄 축소\n- 호르무즈 해협 유조선 공격에 따른 해상수송 위험 재확대\n- 후티 반군의 사우디 에너지시설 공격 및 추가 위협\n- 리비아 송유관 차질에 따른 원유 공급위험\n- 미국 원유재고 감소 우려와 공급 ailyDetail 화동 항만재고 24,400mt, 전주 대비 -7,100mt\n- ICIS 10/28 별도 조사 재고 23,800mt, 전주 34,500mt 대비 -10,700mt\n- ICIS 중국 SM 가동률 전주 65.0% → 금주 64.5%\n- ICIS 중국산 11월 선적 수출판매 60,000mt 초과, 주로 인도·튀르키예·유럽\n- ICIS 10/30 FOB China 근월 수출 오퍼 $1,500~1,520/mt, 원월 $1,455~1,475/mt\n- Platts와 ICIS의 재고 집계일·출처는 서로 다름", "daily_prices": [{"date": "10/26", "price": 1442}, {"date": "10/27", "price": 1421}, {"date": "10/28", "price": 1417}, {"date": "10/29", "price": 1381}, {"date": "10/30", "price": 1425.5}], "ai_outlook": "보합 전망. 화동 항만재고의 낮은 수준과 일부 SM 설비의 낮은 가동률, 중동발 공급 차질 및 인도 등 역외 수출수요는 근월물 가격 하단을 지지할 가능성이 큼. 다만 29일 급락 후 30일의 빠른 반등만으로 최종수요 회복을 확정할 수 없고 ABS·PS·EPS의 저마진은 현물 구매 확대를 제한함. 중국 내수 가동률이나 항만 입항이 늘면 긴축은 완화될 수 있으며, 백워데이션에서 Platts 평가 도착기간이 더 저렴한 원월물로 이동하면 동일 도착월 실거래가 하락하지 않아도 평가가격에 하방 효과가 발생할 수 있어 롤오버와 실제 성약을 구분해야 함. 화동 재고와 입출고, DCE EB 선물, 11~12월 도착 스프레드, 수출 실거래 및 유도품 가동률이 반증지표이며 재고 급증·구매 축소가 나타나면 하락으로, 근월 부족과 수출 성사가 강화되면 상승으로 수정할 필요가 있음."}, "Acrylonitrile": {"price": 1610, "prev_price": 1600, "change_abs": 10, "change_pct": 0.63, "commentary": "아시아 AN은 주초 중국 프로필렌 내수가 강세로 생산원가 부담이 높아지면서 생산자들이 판매가격을 지지했지만 ABS 등 주요 유도품의 구매 여력은 부족하고 수출 문의도 제한적이었으며, 대만 CPDC의 정기보수와 연말 Formosa 보수 계획, 중국 설비 가동이 공급 기대를 엇갈리게 하는 가운데 Platts CFR Far East Asia가 27일 $1,610/mt로 전주 대비 상승으로 마감", "factors": "- 산둥 프로필렌 가격의 주간 CNY400/mt 상승에 따른 원가 부담\n- 중국 AN 생산자의 낮은 마진과 가격 방어\n- 대만 CPDC 가오슝 AN 설비 10/19부터 약 1개월 보수\n- Formosa 마이랴오 AN 설비 12월 하순 보수 예정\n- 중국 Sailboat AN 설비 10월 가동률 약 90%\n- ABS·아크릴섬유 수요 부진과 수출 구매 저항", "outlook": "프로필렌 강세와 일부 역내 보수가 가격을 지지하나 고가 구매 저항과 중국 상업용 AN 공급 확대 가능성으로 상승 지속성은 제한적임. 단기에는 프로필렌·암모니아 원가와 실제 보수 물량, 중국 수출 오퍼가 거래로 이어지는지 확인이 필요함.", "additional_info": "- Platts 10/27 ACN CFR Far East Asia Weekly $1,610/mt, 10/20 $1,600/mt(+0.63%)\n- Platts 10/27 FOB China $1,550/mt, 전주 대비 +$10/mt\n- 10/27 산둥 프로필렌 CNY11,000/mt, 전주 대비 +CNY400/mt\n- 산둥 AN 내수 가격 관측 범위 CNY11,000~12,000/mt\n- Formosa 마이랴오 AN 140,000mt/yr 2기 12월 하순 약 25일 보수 계획\n- CPDC 가오슝 AN 라인 10/19 중단·약 1개월 보수\n- Sailboat AN 260,000mt/yr 설비 2기 10월 약 90% 가동 s": "- 원유 조정에 따른 중국 MMA 구매 관망\n- 아세톤·MTBE·C4 원가와 중국 일부 메탄올 부족\n- 역내 MMA 저가동·제한적 현물 재고\n- 해상운임과 선박 확보 부담\n- 한국·대만의 약한 수입 구매\n- 연말 결산에 따른 보수적인 유도품 재고 운영", "outlook": "MMA는 다른 수지 원료와 달리 원료 조달 제약과 운임 부담이 판매자의 하단을 지지해 원유 약세가 즉시 CFR 가격 하락으로 이어지지 않았음. 다만 중국 내수 약세와 연말 구매 관망은 오퍼 인상 수용을 제한하므로 현물 부족 자체를 수요 회복으로 해석하면 안 됨. 설비·원료 공급 정상화가 진전되면 하락할 수 있고 운임 상승과 추가 생산차질이 확인되면 보합 상단을 시험할 수 있음.", "additional_info": "- ICIS 500mt 이상 CFR South Korea Low/Mid/High $1,920/$1,945/$1,970/mt\n- 11월 13일 신규 Weekly Published, Mid change $0/mt\n- 500mt 미만 동남아 MMA Mid $2,045/mt는 별도 등급·수량 조건\n- 중국산 11월 말~12월 선적 판매의향 $1,800~1,810/mt FOB China\n- 중국 외 아시아산 수출 판매의향 약 $1,840/mt FOB Asia\n- 중국 MMA 가동률 약 59%라는 시장 전언\n- 수요 부진에도 해상운임·선박 조달과 원료 차질 부담", "daily_prices": [], "ai_outlook": "보합 전망. 원유가 조정됐더라도 아세톤·MTBE·C4와 중국 일부 메탄올의 조달 제약이 MMA 원가를 높게 유지하고 있으며, 낮은 가동과 제한적 현물 재고가 한국 도착가격을 지지함. 반면 한국·대만 수입수요는 약하고 중국 내수도 낮아졌으므로 공급 부족을 추가 인상으로 단정하기 어렵고 연말 재고 관리가 수요 회복을 지연시킬 수 있음. 중국에서 알려진 FOB $1,800~1,810/mt 판매의향은 해상운임과 500mt 이상 수량 조건을 반영하지 않은 채 CFR South Korea 평가와 비교하면 안 됨. 생산설비가 정상화되고 운임이 완화되면서 실제 저가 CFR 거래가 늘면 하락 전환할 수 있지만 원료 차질이 장기화되거나 용선비가 오르면 가격 방어가 이어질 수 있음. 중국 가동률, 역내 현물 재고, 한국·대만 구매 성약, FOB-CFR 운임차를 추적해 대응할 필요가 있음."}}}};

// ───────────────────────── 2. 공통 유틸 ─────────────────────────
function esc(s) { // HTML 특수문자를 안전하게 바꾸는 함수
  return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); // 문자 치환
}
function num(v) { // 문자·숫자를 숫자로 바꾸고 비었으면 NaN 을 돌려주는 함수
  if (v === null || v === undefined || v === '') return NaN; // 빈 값은 NaN
  const n = parseFloat(String(v).replace(/,/g, '')); // 쉼표 제거 후 숫자 변환
  return isNaN(n) ? NaN : n; // 변환 실패는 NaN
}
function clone(o) { return JSON.parse(JSON.stringify(o)); } // 깊은 복사
function fmtNum(v, dec) { // 가격 표기: WTI 는 소수 2자리 고정, 나머지는 소수가 있을 때만 1자리
  if (!isFinite(v)) return '–'; // 값이 없으면 대시
  const d = dec === 2 ? 2 : (Math.abs(v % 1) > 1e-9 ? 1 : 0); // 소수 자릿수 결정
  return v.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d }); // 천 단위 쉼표
}
function dirOf(v) { // 증감 방향: 1 상승, -1 하락, 0 보합
  if (!isFinite(v)) return 0; // 값이 없으면 보합 취급
  return Math.abs(v) < 1e-9 ? 0 : (v > 0 ? 1 : -1); // 부호 판정
}
function dirColor(d) { return d > 0 ? C.red : (d < 0 ? C.blue : C.blk); } // 상승 원색 빨강, 하락 원색 파랑, 보합 검정
function dirArrow(d) { return d > 0 ? '▲' : (d < 0 ? '▼' : '–'); } // 방향 기호
function dirWord(d) { return d > 0 ? '상승' : (d < 0 ? '하락' : '보합'); } // 방향 낱말
function deltaText(v, meta) { // 증감 금액 표기(▲190 / ▼175.5 / –)
  const d = dirOf(v); // 방향
  return d === 0 ? '–' : dirArrow(d) + fmtNum(Math.abs(v), meta.dec); // 보합이면 대시
}
function pctText(p, digits) { // 증감률 표기(▲11.80% / ▼12.76% / 0.00%)
  const d = dirOf(p); // 방향
  if (d === 0) return (0).toFixed(digits) + '%'; // 보합은 0.00%
  return dirArrow(d) + Math.abs(p).toFixed(digits) + '%'; // 기호 + 절대값
}
function weekParts(w) { // 'YYYY-Wnn' 을 연·주로 나누는 함수
  const m = /^(\d{4})-W(\d{2})$/i.exec(String(w || '')); // 형식 검사
  return m ? { y: +m[1], n: +m[2] } : null; // 연·주 반환
}
function isoFriday(w, offsetWeeks) { // 해당 주차(+오프셋)의 금요일 날짜(UTC)
  const p = weekParts(w); // 연·주
  if (!p) return null; // 형식 오류
  const jan4 = new Date(Date.UTC(p.y, 0, 4)); // 1월 4일은 항상 1주차
  const day = jan4.getUTCDay() || 7; // 월=1 … 일=7
  const mon = new Date(jan4); // 월요일 계산용 복사
  mon.setUTCDate(jan4.getUTCDate() - day + 1 + (p.n - 1 + (offsetWeeks || 0)) * 7); // 해당 주 월요일
  const fri = new Date(mon); // 금요일 계산용 복사
  fri.setUTCDate(mon.getUTCDate() + 4); // 월 + 4일
  return fri; // 금요일
}
function mdText(d) { return d ? (d.getUTCMonth() + 1) + '/' + d.getUTCDate() : ''; } // 날짜 → 'M/D'
function weekShort(w) { const p = weekParts(w); return p ? 'W' + String(p.n).padStart(2, '0') : String(w); } // 'W45'
function fridayText(w, off) { return mdText(isoFriday(w, off || 0)); } // 금요일 'M/D'
function weekLabel(w) { return weekShort(w) + ' (' + fridayText(w) + ')'; } // 'W45 (11/6)'
function weekRangeText(w) { // 'M/D~M/D' 월~금 범위
  const f = isoFriday(w, 0); // 금요일
  if (!f) return ''; // 형식 오류
  const m = new Date(f); m.setUTCDate(f.getUTCDate() - 4); // 월요일
  return mdText(m) + '~' + mdText(f); // 범위 문자열
}
let toastTimer = 0; // 토스트 타이머
function toast(msg, ms) { // 화면 아래 한글 안내문을 잠깐 보여주는 함수
  const t = document.getElementById('toast'); // 토스트 요소
  if (!t) return; // 아직 화면이 없으면 무시
  t.textContent = msg; // 문구 넣기
  t.classList.add('on'); // 보이기
  clearTimeout(toastTimer); // 이전 타이머 취소
  toastTimer = setTimeout(() => t.classList.remove('on'), ms || 2600); // 잠시 후 숨기기
}
function lines(s) { // 여러 줄 문자열을 글머리표 제거한 줄 배열로 바꾸는 함수
  return String(s || '').split(/\n+/).map(x => x.replace(/^\s*[-•·▪]\s*/, '').trim()).filter(Boolean); // 줄 정리
}

// ───────────────────────── 3. 시트(GAS) 연동 ─────────────────────────
async function callGAS(action, payload) { // 기존 앱과 같은 방식으로 Apps Script 를 호출하는 함수
  try { // 네트워크 오류를 잡기 위함
    const body = Object.assign({ action }, payload || {}); // 요청 본문
    const isPost = ['saveEntry', 'updateItemData'].includes(action); // 저장 계열은 POST
    const url = isPost ? GAS_URL : GAS_URL + '?data=' + encodeURIComponent(JSON.stringify(body)); // 읽기는 GET 쿼리
    const ctl = new AbortController(); // 시간 제한용
    const tm = setTimeout(() => ctl.abort(), 20000); // 20초 후 중단
    const res = await fetch(url, { method: isPost ? 'POST' : 'GET', headers: { 'Content-Type': 'text/plain' }, body: isPost ? JSON.stringify(body) : null, redirect: 'follow', signal: ctl.signal }); // 호출
    clearTimeout(tm); // 타이머 해제
    return await res.json(); // JSON 응답
  } catch (e) { // 실패 시
    console.warn('시트 연결 실패', e); // 개발자 도구용 기록
    return { success: false, error: String(e) }; // 실패 객체
  }
}
function normalizeDaily(raw) { // 일간 가격을 [{date, price}] 형태로 맞추는 함수
  if (!raw) return []; // 없으면 빈 배열
  if (typeof raw === 'string') { // 문자열이면
    try { raw = JSON.parse(raw); } catch (_) { // JSON 이 아니면 줄 단위로 해석
      return raw.split(/\n+/).map(l => l.trim()).filter(Boolean).map(l => { // 한 줄씩
        const p = l.split(/[,:|]/).map(v => v.trim()); // 날짜,가격
        return (p.length >= 2 && isFinite(num(p[1]))) ? { date: p[0], price: num(p[1]) } : null; // 변환
      }).filter(Boolean); // 실패 제거
    }
  }
  if (!Array.isArray(raw)) return []; // 배열이 아니면 빈 배열
  return raw.map(x => { // 항목별 정리
    if (Array.isArray(x) && x.length >= 2) return { date: String(x[0]), price: num(x[1]) }; // [날짜,가격]
    if (x && typeof x === 'object') return { date: String(x.date ?? x.day ?? x.label ?? ''), price: num(x.price ?? x.value ?? x.close) }; // 객체
    return null; // 그 밖은 무시
  }).filter(x => x && isFinite(x.price)); // 숫자 아닌 것 제거
}
function splitMergedSections(addText, aiText, dailyRaw) { // 시트 옛 주차: 추가정보 칸에 "데일리가격 / ai 전망" 머리글이 섞여 들어온 것을 칸별로 나누는 함수
  const src = String(addText || ''); // 추가정보 원문
  if (!/(^|\n)\s*[-•·*]?\s*(ai\s*전망|데일리\s*가격)\s*[:：]?\s*(\n|$)/i.test(src)) return { add: src, ai: aiText || '', daily: dailyRaw }; // 섞이지 않았으면 그대로
  const head = line => { // 한 줄이 머리글인지 판별
    const t = line.replace(/^\s*[-•·*]\s*/, '').trim().replace(/[:：]$/, '').trim(); // 불릿·콜론 제거
    if (/^ai\s*전망$/i.test(t)) return 'ai'; // AI 전망 머리글
    if (/^데일리\s*가격$/.test(t)) return 'daily'; // 데일리가격 머리글
    if (/^(추가\s*정보|결론\s*및\s*전망|변[동둉]\s*요인|코멘터리)$/.test(t)) return 'other'; // 그 밖의 머리글
    return ''; // 일반 줄
  };
  const add = [], ai = [], daily = []; // 칸별 줄 모음
  let cur = 'add'; // 현재 칸
  src.split(/\r?\n/).forEach(line => { // 줄마다
    const h = head(line); // 머리글 여부
    if (h) { cur = h === 'other' ? 'add' : h; return; } // 머리글이면 칸만 바꾸고 줄은 버림
    if (!line.trim()) return; // 빈 줄 무시
    (cur === 'ai' ? ai : (cur === 'daily' ? daily : add)).push(line.replace(/^\s*[-•·*]\s*(?=\S)/, cur === 'add' ? '- ' : '').trim()); // 해당 칸에 추가
  });
  const dailyList = []; // 일별 가격 목록
  daily.forEach(l => { const m = /^\s*(\d{1,2}\/\d{1,2})\s*[:,]\s*\$?\s*([\d,]+(?:\.\d+)?)/.exec(l); if (m) dailyList.push([m[1], m[2].replace(/,/g, '')]); }); // "9/7: $1,335" 또는 "9/7,1335" 형태만 읽음("자료 없음"은 무시)
  const hasDaily = Array.isArray(dailyRaw) ? dailyRaw.length > 0 : !!dailyRaw; // 이미 일별 가격이 있는지
  return { add: add.map(l => l.replace(/^-\s*-\s*/, '- ')).join('\n'), ai: aiText || ai.join(' ').replace(/\s+/g, ' ').trim(), daily: hasDaily ? dailyRaw : dailyList }; // 이미 채워진 칸은 건드리지 않음
}
function normalizeWeek(data) { // 시트·내장 자료를 앱 내부 표준 형태로 맞추는 함수
  const out = { week: data.week, as_of: data.as_of || '', source: data.source || '', summary_headline: data.summary_headline || '', items: {} }; // 뼈대
  ITEMS.forEach(m => { // 6개 품목 모두
    const d = (data.items || {})[m.key] || {}; // 원본 품목
    const stored = v => (v === undefined || v === null || v === '') ? null : num(v); // 저장된 증감값(없으면 null)
    const sp = splitMergedSections(d.additional_info ?? d['추가정보'] ?? '', d.ai_outlook ?? d['ai 전망'] ?? d['AI 전망'] ?? '', d.daily_prices ?? d.dailyPrice ?? d.daily_data ?? []); // 섞인 칸 분리
    out.items[m.key] = { // 표준 필드
      price: d.price ?? '', // 현재가
      prev_price: d.prev_price ?? d.previous_price ?? '', // 전주 가격
      change_abs: stored(d.change_abs), // 저장된 증감액(검산용)
      change_pct: stored(d.change_pct), // 저장된 증감률(검산용)
      commentary: d.commentary ?? d.comment ?? '', // 코멘터리
      factors: d.factors ?? d['변동요인'] ?? '', // 변동요인
      outlook: d.outlook ?? d['결론및전망'] ?? d['결론 및 전망'] ?? '', // 결론 및 전망
      ai_outlook: sp.ai, // AI 전망(칸이 비어 있으면 추가정보에 섞인 것에서 분리)
      additional_info: sp.add, // 추가정보(머리글 제거)
      daily_prices: normalizeDaily(sp.daily), // 일간 가격
      headline: d.headline ?? '', // 핵심 메시지(비우면 자동 초안)
      note: d.note ?? '' // 하단 주석(예: 휴일로 평가 없음 → 전일가 적용)
    };
  });
  return out; // 표준화된 주차 자료
}
function mergeNonempty(localItems, remoteItems) { // 시트의 비어 있지 않은 값이 내장 자료를 덮어쓰는 병합(기존 앱과 동일)
  const merged = Object.assign({}, localItems || {}); // 내장 자료에서 시작
  Object.keys(remoteItems || {}).forEach(name => { // 시트 품목마다
    const fields = remoteItems[name]; // 시트 필드
    if (!fields || typeof fields !== 'object') return; // 형식 오류는 무시
    const chosen = Object.assign({}, merged[name] || {}); // 기존 값 복사
    Object.keys(fields).forEach(k => { // 필드마다
      const v = fields[k]; // 값
      if (v === null || v === undefined || v === '') return; // 빈 값은 건너뜀
      if (Array.isArray(v) && v.length === 0) return; // 빈 배열도 건너뜀
      chosen[k] = v; // 시트 값 채택
    });
    merged[name] = chosen; // 병합 결과 저장
  });
  return merged; // 병합된 품목들
}
function mergeWeek(week, local, remote) { // 내장 자료와 시트 응답을 주차별 규칙대로 합치는 함수
  const rOk = !!(remote && remote.success && remote.items); // 시트 응답 유효 여부
  const rItems = rOk ? remote.items : {}; // 시트 품목
  if (!local) return rOk ? normalizeWeek(Object.assign({}, remote, { week })) : null; // 내장 자료가 없으면 시트만 사용
  let items; // 최종 품목
  if (FORCE_LOCAL.includes(week)) { // W40: 내장 자료 고정
    items = local.items; // 내장 자료 사용
  } else if (VERIFIED.includes(week)) { // W42~W46: 가격은 검증된 내장 자료 우선
    items = mergeNonempty(local.items, rItems); // 문구는 시트 우선 병합
    Object.keys(local.items).forEach(name => { // 품목마다 가격 검증
      const live = rItems[name] || {}; // 시트 품목
      const ver = local.items[name]; // 검증된 내장 품목
      if (Number(live.price) !== Number(ver.price)) { // 시트 가격이 다르면
        items[name] = Object.assign({}, ver); // 내장 자료 전체로 복원
      } else { // 가격이 같으면 숫자 필드는 내장값 고정
        ['price', 'prev_price', 'change_abs', 'change_pct', 'daily_prices'].forEach(k => { items[name][k] = ver[k]; }); // 숫자 필드 복사
      }
    });
  } else { // 그 밖의 내장 주차(W41 등): 시트 우선 병합
    items = mergeNonempty(local.items, rItems); // 병합
  }
  return normalizeWeek(Object.assign({}, local, { items, week })); // 표준화
}
async function loadWeekList() { // 시트와 내장 자료의 주차 목록을 합치는 함수
  const res = await callGAS('getWeekList', {}); // 시트 주차 목록
  state.sheetOk = !!(res && res.success); // 연결 성공 여부 기록
  let weeks = (res && res.success && Array.isArray(res.weeks)) ? res.weeks.slice() : []; // 시트 주차
  Object.keys(SEED).forEach(w => { if (!weeks.includes(w)) weeks.push(w); }); // 내장 주차 추가
  weeks = weeks.filter(w => weekParts(w)); // 형식이 맞는 것만
  weeks = Array.from(new Set(weeks)).sort(); // 중복 제거 후 오름차순
  return weeks; // 주차 목록
}
async function fetchWeek(week, force) { // 한 주차 자료를 시트+내장 자료로 불러오는 함수
  if (!force && state.cache[week]) return state.cache[week]; // 캐시 사용
  if (state.dirty[week] && state.cache[week]) return state.cache[week]; // 수정 중인 주차는 덮어쓰지 않음
  const remote = state.offline ? null : await callGAS('getData', { week }); // 시트 호출(첫 화면 때는 건너뜀)
  const merged = mergeWeek(week, SEED[week] || null, remote); // 병합
  if (merged) state.cache[week] = merged; // 캐시에 저장
  return merged; // 결과(없으면 null)
}
async function loadWindow(week, n) { // 선택 주차 기준 최근 n주(기본 6주) 자료를 불러오는 함수
  const i = state.weeks.indexOf(week); // 선택 주차 위치
  const slice = state.weeks.slice(Math.max(0, i - ((n || 6) - 1)), i + 1); // 최근 n개 기록 주차
  const list = await Promise.all(slice.map(w => fetchWeek(w))); // 병렬 로드
  return list.filter(Boolean); // 불러온 것만
}
function itemPayload(week, key) { // 시트에 저장할 품목 페이로드를 만드는 함수(기존 앱 필드 + 추가 필드)
  const it = state.cache[week].items[key]; // 화면 자료
  return { week, item: key, price: it.price, commentary: it.commentary, factors: it.factors, outlook: it.outlook, additional_info: it.additional_info, daily_prices: it.daily_prices, ai_outlook: it.ai_outlook, prev_price: it.prev_price, headline: it.headline }; // 페이로드
}
async function saveItemToSheet(week, key) { // 품목 1개를 시트에 저장하는 함수(updateItemData)
  const res = await callGAS('updateItemData', itemPayload(week, key)); // 호출
  return !!(res && res.success); // 성공 여부
}
async function saveWeekToSheet(week) { // 주차 전체를 시트에 저장하는 함수(saveEntry)
  const items = {}; // 품목 모음
  ITEMS.forEach(m => { const p = itemPayload(week, m.key); delete p.week; delete p.item; items[m.key] = p; }); // 품목별 페이로드
  const res = await callGAS('saveEntry', { data: { week, items } }); // 호출
  return !!(res && res.success); // 성공 여부
}

// ============================================================================
// 02_scene.js — 장면(scene) 모델: 화면 렌더러와 PPT 변환기가 함께 읽는 "요소 목록"을 만든다
// · 모든 좌표는 인치, 글자 크기는 pt 로 저장한다 (화면에서만 px 로 환산)
// · 요소 종류: text / shape / table / chart
// · 이 파일은 DOM 을 직접 만들지 않는다. (글 넘침 측정만 03_render.js 의 measureH 를 호출)
// ============================================================================

// ───────────────────────── 1. 요소 팩토리 ─────────────────────────
function Rn(t, o) { // 글자 조각(run) 하나를 만드는 함수
  return Object.assign({ t: String(t === undefined || t === null ? '' : t), sz: 8, b: false, c: C.blk }, o || {}); // 기본: 8pt, 보통, 검정
}
function Pa(runs, o) { // 문단(paragraph) 하나를 만드는 함수
  return Object.assign({ runs: Array.isArray(runs) ? runs : [runs], al: 'l', bul: false, sp: 0 }, o || {}); // al: l/c/r, bul: 글머리표, sp: 문단 앞 간격(pt)
}
function Tx(x, y, w, h, paras, o) { // 텍스트 상자 요소
  return Object.assign({ t: 'text', x, y, w, h, paras, va: 't', ins: [0, 0, 0, 0], step: 0 }, o || {}); // va: t/m/b, ins: [왼,위,오,아래] 인치
}
function Sh(shp, x, y, w, h, o) { // 도형 요소 (글자는 같은 도형 안에 넣는다)
  return Object.assign({ t: 'shape', shp, x, y, w, h, fill: null, line: null, rad: 0, paras: null, va: 'm', ins: [0.06, 0.03, 0.06, 0.03], step: 0 }, o || {}); // shp: rect/round/ellipse/diamond/line/bracket
}
function Tb(x, y, colW, rowH, rows, o) { // 표 요소 (셀마다 서식 지정)
  return Object.assign({ t: 'table', x, y, colW, rowH, rows, border: 'h', step: 0 }, o || {}); // border: none/cell/h/all
}
function Ch(x, y, w, h, o) { // 차트 요소
  return Object.assign({ t: 'chart', x, y, w, h, step: 0 }, o || {}); // cats, series, min, max, plot, dec, gap
}
function Cell(paras, o) { // 표 셀 하나
  return Object.assign({ paras, fill: null, va: 'm', ins: [0.05, 0.02, 0.05, 0.02], cs: 1, rs: 1, bd: {} }, o || {}); // bd: {l,r,t,b:{c,w}}
}
function sline(c, w, dash) { return { c, w, dash: dash || 'solid' }; } // 선 서식 객체

// ───────────────────────── 2. 통계(검산 포함) ─────────────────────────
function itemStats(key, win, week) { // 한 품목의 금주 통계·6주 이력을 계산하는 함수
  const meta = ITEM_BY_KEY[key]; // 품목 정의
  const series = []; // 주차별 이력
  win.forEach((w, i) => { // 최근 6주를 차례로
    const it = w.items[key]; // 그 주 품목
    const price = num(it.price); // 그 주 가격
    let prev = num(it.prev_price); // 그 주 전주 가격(저장값)
    if (!isFinite(prev) && i > 0) prev = num(win[i - 1].items[key].price); // 저장값이 없으면 직전 주차 가격
    const d = (isFinite(price) && isFinite(prev)) ? price - prev : NaN; // 전주 대비 증감액
    const p = (isFinite(d) && prev !== 0) ? d / prev * 100 : NaN; // 전주 대비 증감률(%)
    series.push({ week: w.week, label: weekShort(w.week), fri: fridayText(w.week), price, prev, d, p }); // 이력 한 칸
  });
  const cur = series[series.length - 1]; // 금주
  const it = win[win.length - 1].items[key]; // 금주 원본 품목
  const valid = series.filter(s => isFinite(s.price)); // 가격이 있는 주차
  const hi = valid.length ? Math.max.apply(null, valid.map(s => s.price)) : NaN; // 6주 고가
  const lo = valid.length ? Math.min.apply(null, valid.map(s => s.price)) : NaN; // 6주 저가
  const avg = valid.length ? valid.reduce((a, s) => a + s.price, 0) / valid.length : NaN; // 6주 평균
  const vsAvg = (isFinite(cur.price) && isFinite(avg) && avg !== 0) ? (cur.price - avg) / avg * 100 : NaN; // 6주 평균 대비 %
  const daily = (it.daily_prices || []).filter(x => isFinite(x.price)); // 금주 일간 가격
  const dailyD = daily.map((x, i) => { // 일간 전일 대비(첫날은 전주 가격과 비교)
    const base = i === 0 ? cur.prev : daily[i - 1].price; // 비교 기준
    return isFinite(base) ? x.price - base : NaN; // 증감
  });
  const dv = daily.map(x => x.price); // 일간 가격 배열
  const range = dv.length ? Math.max.apply(null, dv) - Math.min.apply(null, dv) : NaN; // 주중 변동폭
  const notes = []; // 검산 주석
  if (it.change_abs !== null && isFinite(it.change_abs) && isFinite(cur.d) && Math.abs(it.change_abs - cur.d) > 0.05) notes.push(meta.code + ' 증감액 원본 ' + fmtNum(it.change_abs, meta.dec) + ' ≠ 계산 ' + fmtNum(cur.d, meta.dec) + ' (확인 필요)'); // 증감액 불일치
  if (it.change_pct !== null && isFinite(it.change_pct) && isFinite(cur.p) && Math.abs(it.change_pct - cur.p) > 0.05) notes.push(meta.code + ' 증감률 원본 ' + it.change_pct + '% ≠ 계산 ' + cur.p.toFixed(2) + '% (확인 필요)'); // 증감률 불일치
  if (meta.bnote) notes.push(meta.bnote + '.'); // 벤치마크 기준 주석(AN 수요일 발표 등)
  if (it.note) notes.push(it.note + '.'); // 자료에 적힌 주석(휴일 보충 등)
  return { meta, it, key, price: cur.price, prev: cur.prev, d: cur.d, p: cur.p, dir: dirOf(cur.d), series, hi, lo, avg, vsAvg, daily, dailyD, range, isDaily: daily.length >= 2, notes }; // 통계 묶음
}
function priceStr(v, meta) { return isFinite(v) ? fmtNum(v, meta.dec) : '–'; } // 가격 문자열
function unitPrice(v, meta) { return isFinite(v) ? '$' + fmtNum(v, meta.dec) + '/' + meta.per : '–'; } // $1,250/MT 표기

// ───────────────────────── 3. 핵심 메시지(자동 초안) ─────────────────────────
function itemHeadline(st) { // 품목 핵심 메시지 문단 목록(사용자가 headline 을 넣으면 그것을 우선)
  const m = st.meta; // 품목 정의
  if (st.it.headline) return [Pa([Rn('□ ', { sz: 13, b: true }), Rn(st.it.headline, { sz: 13, b: true })])]; // 사용자 지정 문구
  const col = dirColor(st.dir); // 방향 색
  let lead = m.code + ' ' + unitPrice(st.price, m); // 품목 + 가격
  if (isFinite(st.d)) lead += ', 전주 대비 ' + (st.dir === 0 ? '보합' : deltaText(st.d, m) + ' (' + pctText(st.p, 1) + ') ' + dirWord(st.dir)); // 전주 대비
  const fs = lines(st.it.factors); // 변동요인 줄
  let tail = ''; // 뒤에 붙일 변동요인
  fs.slice(0, 2).forEach(f => { // 앞 두 줄까지만, 길이를 넘지 않을 때만
    const cand = tail ? tail + ' / ' + f : ' — ' + f; // 이어붙인 후보
    if ((lead + cand).length <= 92) tail = cand; // 두 줄 안에 들어오면 채택
  });
  return [Pa([Rn('□ ', { sz: 13, b: true }), Rn(lead, { sz: 13, b: true, c: col }), Rn(tail, { sz: 13, b: true })])]; // 강조 구간만 방향 색
}
function summaryHeadline(wk, sts) { // 요약 쪽 핵심 메시지
  if (wk.summary_headline) return [Pa([Rn('□ ', { sz: 13, b: true }), Rn(wk.summary_headline, { sz: 13, b: true })])]; // 사용자 지정 문구
  const up = sts.filter(s => s.dir > 0).length, dn = sts.filter(s => s.dir < 0).length, fl = sts.length - up - dn; // 방향별 개수
  const withP = sts.filter(s => isFinite(s.p) && s.dir !== 0); // 변동이 있는 품목
  const best = withP.filter(s => s.dir > 0).sort((a, b) => b.p - a.p)[0]; // 최대 상승
  const worst = withP.filter(s => s.dir < 0).sort((a, b) => a.p - b.p)[0]; // 최대 하락
  const runs = [Rn('□ ' + weekShort(wk.week) + ' 6개 품목 : ', { sz: 13, b: true }), Rn('상승 ' + up, { sz: 13, b: true, c: C.red }), Rn(' · ', { sz: 13, b: true }), Rn('하락 ' + dn, { sz: 13, b: true, c: C.blue }), Rn(' · 보합 ' + fl, { sz: 13, b: true })]; // 개수
  if (best) runs.push(Rn(' — 최대 상승 ' + best.meta.code + ' ', { sz: 13, b: true }), Rn(pctText(best.p, 1), { sz: 13, b: true, c: C.red })); // 최대 상승
  if (worst) runs.push(Rn(best ? ', 최대 하락 ' : ' — 최대 하락 ', { sz: 13, b: true }), Rn(worst.meta.code + ' ' + pctText(worst.p, 1), { sz: 13, b: true, c: C.blue })); // 최대 하락
  return [Pa(runs)]; // 문단 1개
}

// ───────────────────────── 4. 공통 조각 ─────────────────────────
