  if (o.sub) els.push(Tx(o.x + o.w - 0.1 - subW, o.y + 0.06, subW, 0.26, [Pa(Rn(o.sub, { sz: 8, c: C.gray }), { al: 'r' })], { va: 'm' })); // 보조문구
  if (o.pill) els.push(Sh('round', o.x + o.w - 1.12, o.y + 0.08, 1.02, 0.22, { fill: C.wht, line: sline(o.pill.c, 1), rad: 0.11, paras: [Pa(Rn(o.pill.t, { sz: 8, b: true, c: o.pill.c }), { al: 'c' })], ins: [0.02, 0, 0.02, 0] })); // 전망 알약
  els.push(Sh('line', o.x + 0.1, o.y + 0.34, o.w - 0.2, 0, { line: sline(C.navy, 0.75) })); // 머리글 아래 군청선
  return addStep(els, o.step || 0); // 단계 지정 후 반환
}

// ───────────────────────── 5. 본문 글(자동 맞춤) ─────────────────────────
function bodyParas(ls, bul, sz, empty) { // 줄 목록 → 문단 목록
  if (!ls.length) return [Pa(Rn('(내용 없음)', { sz, c: 'A6A6A6' }))]; // 비었을 때 안내
  return ls.map((l, i) => Pa(Rn(l, { sz }), { bul, sp: i === 0 ? 0 : (bul ? 1.5 : 3) })); // 줄마다 문단
}
function fitBody(ls, bul, w, h, ins, sizes) { // 칸에 들어가는 가장 큰 글자 크기를 찾는 함수
  const list = sizes || [8, 7.5, 7, 6.5]; // 시도할 크기(pt)
  let paras = null, sz = list[0], over = false; // 결과
  for (let i = 0; i < list.length; i++) { // 큰 것부터
    sz = list[i]; // 후보 크기
    paras = bodyParas(ls, bul, sz); // 문단 생성
    if (measureH(paras, w, ins) <= h + 0.001) { over = false; break; } // 들어가면 확정
    over = true; // 못 들어가면 계속
  }
  return { paras, sz, over }; // 결과
}
function needH(ls, bul, wIn) { // 글 분량으로 필요한 카드 높이를 어림하는 함수(칸 나누기용)
  const cpl = Math.max(8, Math.floor((wIn - (bul ? 0.13 : 0)) / 0.098)); // 한 줄 글자 수 어림
  let n = 0; // 줄 수
  (ls.length ? ls : ['']).forEach(l => { n += Math.max(1, Math.ceil(l.length / cpl)); }); // 문단별 줄 수
  return 0.5 + n * 0.127; // 머리글 0.42 + 여백 + 줄 높이
}
function splitHeights(total, gap, needs, min) { // 한 열의 카드 2개 높이를 분량에 맞춰 나누는 함수
  const avail = total - gap * (needs.length - 1); // 가용 높이
  const sum = needs.reduce((a, b) => a + b, 0); // 필요 합계
  let hs; // 결과
  if (sum <= avail) hs = needs.map(n => n + (avail - sum) / needs.length); // 여유는 균등 분배
  else hs = needs.map(n => Math.max(min, avail * n / sum)); // 부족하면 비례 축소
  const s2 = hs.reduce((a, b) => a + b, 0); // 합계 재계산
  return hs.map(h => h * avail / s2); // 합이 정확히 avail 이 되게 보정
}
function textCard(o) { // 글 카드(번호·제목·본문) 요소들과 본문 자동 맞춤 결과
  const els = cardEls({ x: o.x, y: o.y, w: o.w, h: o.h, no: o.no, title: o.title, fill: o.fill, pill: o.pill, step: o.step }); // 카드 틀
  const bx = o.x + 0.1, by = o.y + 0.42, bw = o.w - 0.2, bh = o.h - 0.48; // 본문 영역
  const ls = o.lines; // 본문 줄
  const fit = fitBody(ls, o.bul, bw, bh, [0, 0, 0, 0], o.sz ? [o.sz] : null); // 자동 맞춤(공통 글자 크기가 정해졌으면 그 크기로)
  const body = Tx(bx, by, bw, bh, fit.paras, { step: o.step || 0, bind: o.bind, over: fit.over }); // 본문 상자
  els.push(body); // 추가
  return { els, over: fit.over, name: o.title }; // 반환
}
function outlookPill(txt) { // AI 전망 첫머리의 상승/하락/보합을 알약으로 만드는 함수
  const m = /^\s*(상승|하락|보합)/.exec(txt || ''); // 첫 낱말 검사
  if (!m) return null; // 없으면 알약 없음
  const d = m[1] === '상승' ? 1 : (m[1] === '하락' ? -1 : 0); // 방향
  return { t: '전망 : ' + m[1], c: dirColor(d) }; // 알약 정보
}

function aiGist(txt) { // 요약 표용: AI 전망에서 방향 말머리를 빼고 첫 문장만 줄여 돌려주는 함수
  let t = String(txt || '').replace(/\s+/g, ' ').trim(); // 공백 정리
  t = t.replace(/^(상승|하락|보합)\s*(전망)?\s*[.,:·-]?\s*/, ''); // 맨 앞 "하락 전망." 말머리 제거(알약이 따로 보여 줌)
  const k = t.search(/[.。]\s/); // 첫 문장 끝 위치
  if (k > 0) t = t.slice(0, k + 1); // 첫 문장만 사용
  if (t.length > 120) { // 너무 길면
    const cut = t.lastIndexOf(' ', 118); // 120자 안쪽의 마지막 띄어쓰기
    t = t.slice(0, cut > 60 ? cut : 118) + '…'; // 줄임표로 마무리
  }
  return t; // 반환
}

// ───────────────────────── 6. 차트·델타 행 ─────────────────────────
const PLOT = { x: 0.04, y: 0.2, w: 0.92, h: 0.6 }; // 차트 플롯 영역 비율(좌·상·폭·높이)
function lineScale(vals) { // 선 차트 축 범위
  const hi = Math.max.apply(null, vals), lo = Math.min.apply(null, vals); // 최대·최소
  const r = (hi - lo) || Math.abs(hi) * 0.02 || 1; // 변동폭(없으면 2%)
  return { min: lo - r * 0.6, max: hi + r * 0.55 }; // 위쪽 라벨 공간 확보
}
function barScale(vals) { // 막대 차트 축 범위(0에서 시작하지 않음 — 주석에 명시)
  const hi = Math.max.apply(null, vals), lo = Math.min.apply(null, vals); // 최대·최소
  const r = hi - lo; // 변동폭
  if (r <= 0) return { min: lo * 0.85, max: hi * 1.08 }; // 모두 같으면 비율로
  return { min: Math.max(0, lo - r * 1.0), max: hi + r * 0.35 }; // 라벨 공간 포함
}
function deltaRow(chart, texts, colors) { // 차트 아래 증감 행(차트 플롯 폭에 맞춘 1행 표)
  const n = texts.length; // 칸 수
  const px = chart.x + PLOT.x * chart.w, pw = PLOT.w * chart.w; // 플롯 좌측·폭
  const cw = []; for (let i = 0; i < n; i++) cw.push(pw / n); // 열 너비 균등
  const row = texts.map((t, i) => Cell([Pa(Rn(t, { sz: 8, b: true, c: colors[i] }), { al: 'c' })], { fill: C.soft, ins: [0.01, 0.01, 0.01, 0.01] })); // 증감 셀
  return Tb(px, chart.y + chart.h, cw, [0.2], [row], { border: 'none' }); // 표 요소
}
function dailyChartEls(st, card) { // 일간 선 차트 + 전일 대비 행
  const m = st.meta; // 품목
  const vals = st.daily.map(x => x.price); // 값
  const sc = lineScale(vals); // 축 범위
  const ch = Ch(card.x + 0.08, card.y + 0.38, card.w - 0.16, 1.2, { cats: st.daily.map(x => x.date), plot: PLOT, min: sc.min, max: sc.max, dec: m.dec, gap: 0, series: [{ name: '일간 가격 (' + m.unit + ')', kind: 'line', vals, color: C.bar, lw: 2.25, marker: true, labels: { pos: 't', sz: 8, b: true, c: C.bar } }] }); // 선 차트
  const dr = deltaRow(ch, st.dailyD.map(d => deltaText(d, m)), st.dailyD.map(d => dirColor(dirOf(d)))); // 전일 대비 행
  return [ch, dr]; // 두 요소
}
function weeklyChartEls(st, card, withDelta, withAvg) { // 6주 막대 차트(+전주 대비 행 / 6주 평균 점선)
  const m = st.meta; // 품목
  const ss = st.series.filter(s => isFinite(s.price)); // 가격이 있는 주차만
  const vals = ss.map(s => s.price); // 값
  const sc = barScale(vals); // 축 범위
  const series = [{ name: '주간 가격 (' + m.unit + ')', kind: 'bar', vals, color: C.lgray, ptColors: ss.map((s, i) => i === ss.length - 1 ? C.bar : C.lgray), labels: { pos: 'outEnd', sz: 8, b: true, c: C.blk } }]; // 막대 계열
  if (withAvg && isFinite(st.avg)) series.push({ name: '※보조 6주 평균', kind: 'line', vals: vals.map(() => st.avg), color: C.gray, lw: 1.25, dash: 'dash', marker: false, labels: null }); // 6주 평균 점선
  const h = withDelta ? 1.2 : 1.4; // 차트 높이
  const ch = Ch(card.x + 0.08, card.y + 0.38, card.w - 0.16, h, { cats: ss.map(s => s.label + '(' + s.fri + ')'), plot: PLOT, min: sc.min, max: sc.max, dec: m.dec, gap: 55, series }); // 차트
  const out = [ch]; // 요소 목록
  if (withDelta) out.push(deltaRow(ch, ss.map(s => deltaText(s.d, m)), ss.map(s => dirColor(dirOf(s.d))))); // 전주 대비 행
  return out; // 반환
}
function weekTableEl(st, card) { // 주차 표(구분/가격/증감/등락률, 금주 열 E6E6E6)
  const m = st.meta; // 품목
  const ss = st.series; // 이력
  const n = ss.length; // 열 수
  const lw = 0.77, cw = (card.w - 0.16 - lw) / n; // 열 너비
  const colW = [lw]; for (let i = 0; i < n; i++) colW.push(cw); // 열 너비 목록
  const wb = { l: sline(C.wht, 0.75), r: sline(C.wht, 0.75) }; // 머리글 흰 구분선
  const head = [Cell([Pa(Rn('구분', { sz: 8, b: true, c: C.wht }), { al: 'c' })], { fill: C.blk, bd: wb })]; // 머리글 첫 칸
  ss.forEach((s, i) => { // 주차 머리글
    const cur = i === n - 1; // 금주 여부
    head.push(Cell([Pa(Rn(s.label, { sz: 8, b: true, c: C.wht }), { al: 'c' }), Pa(Rn(s.fri, { sz: 7, c: C.wht }), { al: 'c' })], { fill: cur ? C.navy : C.blk, bd: wb, ins: [0.01, 0.01, 0.01, 0.01] })); // 금주는 군청
  });
  const mk = (label, fn) => { // 데이터 행 생성
    const r = [Cell([Pa(Rn(label, { sz: 8, b: true }), { al: 'c' })], {})]; // 행 머리글
    ss.forEach((s, i) => { const o = fn(s); r.push(Cell([Pa(Rn(o.t, { sz: 8, b: i === n - 1 || o.b, c: o.c }), { al: 'c' })], { fill: i === n - 1 ? C.hdr2 : null, ins: [0.01, 0.01, 0.01, 0.01] })); }); // 금주 열 회색
    return r; // 행
  };
  const rows = [head, mk('가격', s => ({ t: priceStr(s.price, m), c: C.blk, b: true })), mk('증감', s => ({ t: deltaText(s.d, m), c: dirColor(dirOf(s.d)) })), mk('등락률', s => ({ t: isFinite(s.p) ? pctText(s.p, 2) : '–', c: dirColor(dirOf(s.d)) }))]; // 4행
  return Tb(card.x + 0.08, card.y + 0.44, colW, [0.36, 0.32, 0.32, 0.32], rows, { border: 'h' }); // 표 요소
}

// ───────────────────────── 7. 품목 쪽 ─────────────────────────
function kpiEl(i, label, runs, step, bind) { // KPI 상자(둥근 사각형 + 글자 일체)
  const xs = [0.2, 2.15, 4.1, 6.05, 8.0]; // 5칸 x 좌표
  return Sh('round', xs[i], 1.38, 1.85, 0.66, { fill: C.wht, line: sline(C.blk, 1), rad: 0.08, paras: [Pa(Rn(label, { sz: 8, c: C.gray }), { al: 'c' }), Pa(runs, { al: 'c' })], va: 'm', ins: [0.05, 0.03, 0.05, 0.03], step, bind }); // KPI
}
function buildItemSlide(key, win, wk) { // 품목 1장(일간형/주간형 자동 선택)
  const st = itemStats(key, win, wk.week); // 통계
  const m = st.meta; // 품목 정의
  const it = st.it; // 금주 원본
  const els = []; // 요소 목록
  const warn = []; // 경고
  const dc = dirColor(st.dir); // 방향 색
  // (1) 제목·보조문구·방향 알약
  const pillT = dirArrow(st.dir) + ' ' + dirWord(st.dir) + (isFinite(st.p) && st.dir !== 0 ? ' ' + Math.abs(st.p).toFixed(1) + '%' : ''); // 알약 문구
  titleEls(m.title, [m.basis, weekShort(wk.week) + ' (' + weekRangeText(wk.week) + ') · ' + m.unit], { t: pillT, c: dc }).forEach(e => els.push(e)); // 상단
  // (2) 핵심 메시지
  messageBox(itemHeadline(st), 0.82, 0.5, { kind: 'item', key, field: 'headline' }).forEach(e => els.push(e)); // 메시지 상자
  // (3) KPI 5개
  const unitRun = Rn(' ' + m.unit, { sz: 8, c: C.gray }); // 단위 조각
  const k = []; // KPI 목록
  k.push(kpiEl(0, '현재가', [Rn(priceStr(st.price, m), { sz: 14, b: true }), unitRun], 1, { kind: 'item', key, field: 'price', numeric: true, para: 1 })); // 현재가
  k.push(kpiEl(1, '전주 대비', [Rn(st.dir === 0 ? '–' : deltaText(st.d, m), { sz: 12, b: true, c: dc }), Rn(isFinite(st.p) ? ' (' + pctText(st.p, 1) + ')' : '', { sz: 12, b: true, c: dc })], 1)); // 전주 대비
  k.push(kpiEl(2, '전주 가격', [Rn(priceStr(st.prev, m), { sz: 14, b: true }), unitRun], 1, { kind: 'item', key, field: 'prev_price', numeric: true, para: 1 })); // 전주 가격
  k.push(kpiEl(3, (st.series.filter(s => isFinite(s.price)).length) + '주 고·저', [Rn(priceStr(st.hi, m) + ' / ' + priceStr(st.lo, m), { sz: 14, b: true })], 1)); // 고·저
  if (st.isDaily) k.push(kpiEl(4, '주중 변동폭', [Rn(priceStr(st.range, m), { sz: 14, b: true }), unitRun], 1)); // 일간형: 주중 변동폭
  else k.push(kpiEl(4, '6주 평균 대비', [Rn(isFinite(st.vsAvg) ? pctText(st.vsAvg, 1) : '–', { sz: 14, b: true, c: dirColor(dirOf(st.vsAvg)) })], 1)); // 주간형: 평균 대비
  k.forEach(e => els.push(e)); // 추가
  // (4) 차트 카드 2개
  const cy = 2.12, chh = 1.82; // 카드 y, 높이
  if (st.isDaily) { // 일간형
    const c1 = { x: 0.2, y: cy, w: 4.765, h: chh }, c2 = { x: 5.085, y: cy, w: 4.765, h: chh }; // 카드 좌표
    const d0 = st.daily[0].date, d1 = st.daily[st.daily.length - 1].date; // 일간 시작·끝
    cardEls({ x: c1.x, y: c1.y, w: c1.w, h: c1.h, no: 1, title: '일간 가격 추이', sub: d0 + '~' + d1 + ' · 하단 = 전일 대비 · ' + m.unit, subW: 2.75, step: 2 }).forEach(e => els.push(e)); // 카드 ①
    addStep(dailyChartEls(st, c1), 2).forEach(e => els.push(e)); // 일간 차트
    cardEls({ x: c2.x, y: c2.y, w: c2.w, h: c2.h, no: 2, title: '주간 가격 추이 (6주)', sub: '하단 = 전주 대비 · ' + m.unit, subW: 2.0, step: 3 }).forEach(e => els.push(e)); // 카드 ②
    addStep(weeklyChartEls(st, c2, true, false), 3).forEach(e => els.push(e)); // 주간 차트
  } else { // 주간형
    const c1 = { x: 0.2, y: cy, w: 4.875, h: chh }, c2 = { x: 5.2, y: cy, w: 4.65, h: chh }; // 카드 좌표
    cardEls({ x: c1.x, y: c1.y, w: c1.w, h: c1.h, no: 1, title: '주간 가격 추이 (6주)', sub: '점선 = 6주 평균 ' + priceStr(st.avg, m) + ' · ' + m.unit, subW: 2.6, step: 2 }).forEach(e => els.push(e)); // 카드 ①
    addStep(weeklyChartEls(st, c1, false, true), 2).forEach(e => els.push(e)); // 막대 + 평균선
    cardEls({ x: c2.x, y: c2.y, w: c2.w, h: c2.h, no: 2, title: '주차별 가격 표', sub: '단위 : ' + m.unit, subW: 1.3, step: 3 }).forEach(e => els.push(e)); // 카드 ②
    addStep([weekTableEl(st, c2)], 3).forEach(e => els.push(e)); // 주차 표
  }
  // (5) 글 카드 5개
  const top = 4.02, bot = 7.12, gapY = 0.06; // 글 영역 세로 범위
  const lComm = lines(it.commentary), lFact = lines(it.factors), lAdd = lines(it.additional_info), lOut = lines(it.outlook), lAi = lines(it.ai_outlook); // 줄 목록
  const avail = bot - top - gapY; // 한 열에서 카드 2개가 나눠 쓸 높이
  const layouts = [[3.137, 3.137, 3.137], [3.0, 2.66, 3.75], [2.9, 2.3, 4.21]]; // 열 폭 후보(합 9.411 + 간격 0.24 = 9.65) — 글이 많으면 오른쪽 열을 넓힌다
  const sizes = [8, 7.5, 7, 6.5]; // 글자 크기 후보
  const need = (ls, bul, sz, w) => 0.48 + measureH(bodyParas(ls, bul, sz), w - 0.2, [0, 0, 0, 0]); // 카드 1개가 필요한 높이(머리글 0.42 + 아래 여백 0.06 + 본문)
  let csz = sizes[sizes.length - 1], lay = layouts[0], found = false; // 선택 결과
  for (let i = 0; i < sizes.length && !found; i++) { // 큰 글자부터
    for (let j = 0; j < layouts.length && !found; j++) { // 열 폭 후보
      const L = layouts[j], z = sizes[i]; // 후보
      const okA = need(lComm, false, z, L[0]) + need(lFact, true, z, L[0]) <= avail; // A열
      const okB = need(lAdd, true, z, L[1]) <= bot - top; // B열
      const okC = need(lOut, false, z, L[2]) + need(lAi, false, z, L[2]) <= avail; // C열
      if (okA && okB && okC) { csz = z; lay = L; found = true; } // 모두 들어가면 확정
    }
  }
  const wA = lay[0], wB = lay[1], wC = lay[2]; // 열 폭
  const xA = 0.2, xB = xA + wA + 0.12, xC = xB + wB + 0.12; // 열 x 좌표
  const split = (a, b) => { const sum = a + b; const ha = sum <= avail ? a + (avail - sum) / 2 : avail * a / sum; return [ha, avail - ha]; }; // 필요 높이에 맞춰 두 카드 높이 나누기(여유는 균등 분배)
  const hA = split(need(lComm, false, csz, wA), need(lFact, true, csz, wA)); // A열 높이
  const hC = split(need(lOut, false, csz, wC), need(lAi, false, csz, wC)); // C열 높이
  const tcs = []; // 글 카드 결과
  tcs.push(textCard({ x: xA, y: top, w: wA, h: hA[0], no: 3, title: '코멘터리', lines: lComm, bul: false, sz: csz, step: 4, bind: { kind: 'item', key, field: 'commentary' } })); // ③
  tcs.push(textCard({ x: xA, y: top + hA[0] + gapY, w: wA, h: hA[1], no: 4, title: '변동요인', lines: lFact, bul: true, sz: csz, step: 5, bind: { kind: 'item', key, field: 'factors', list: true } })); // ④
  tcs.push(textCard({ x: xB, y: top, w: wB, h: bot - top, no: 5, title: '추가정보', lines: lAdd, bul: true, sz: csz, step: 6, bind: { kind: 'item', key, field: 'additional_info', list: true } })); // ⑤
  tcs.push(textCard({ x: xC, y: top, w: wC, h: hC[0], no: 6, title: '결론 및 전망', lines: lOut, bul: false, sz: csz, fill: C.soft, step: 7, bind: { kind: 'item', key, field: 'outlook' } })); // ⑥
  tcs.push(textCard({ x: xC, y: top + hC[0] + gapY, w: wC, h: hC[1], no: 7, title: 'AI 전망', lines: lAi, bul: false, sz: csz, fill: C.soft, pill: outlookPill(it.ai_outlook), step: 8, bind: { kind: 'item', key, field: 'ai_outlook' } })); // ⑦
  tcs.forEach(tc => { tc.els.forEach(e => els.push(e)); if (tc.over) warn.push(m.code + ' [' + tc.name + '] 글이 칸을 넘칩니다 (최소 글자 크기 적용)'); }); // 추가 + 경고
  // (6) 하단 주석
  const fn = []; // 주석 조각
  fn.push('※ 기준 : ' + m.basis + ', 단위 ' + m.unit + '. 전주 대비 = 금주 − 전주 가격' + (st.isDaily ? '(일간 하단은 전일 대비, 첫날은 전주 가격 대비)' : '') + '.'); // 기준
  fn.push('막대 축은 변동 확인을 위해 0에서 시작하지 않음.'); // 축 주석
  if (wk.source) fn.push('출처 : ' + (String(wk.source).length > 90 ? String(wk.source).slice(0, 90) + '…' : String(wk.source))); // 출처(길면 줄임)
  st.notes.forEach(n => fn.push(n)); // 검산 주석
  els.push(Tx(0.2, 7.15, 9.65, 0.3, [Pa(Rn(fn.join(' '), { sz: 7.5, c: C.gray }))], { va: 't' })); // 주석 상자
  return { id: 'item-' + key, kind: 'item', key, title: m.code, name: m.code, els, warn, notes: st.notes }; // 쪽 객체
}

// ───────────────────────── 8. 요약 쪽 ─────────────────────────
function buildSummarySlide(win, wk) { // 첫 장: 품목 세로 나열, 가격 · 전주비 · 코멘터리
  const sts = ITEMS.map(m => itemStats(m.key, win, wk.week)); // 6개 품목 통계
  const els = []; // 요소 목록
  const warn = []; // 경고
  titleEls('6Keys 주간 가격 요약', [weekShort(wk.week) + ' (' + weekRangeText(wk.week) + ')', '전주 대비 · 단위 $/bbl, $/MT'], null).forEach(e => els.push(e)); // 상단
  messageBox(summaryHeadline(wk, sts), 0.82, 0.46, { kind: 'week', field: 'summary_headline' }).forEach(e => els.push(e)); // 핵심 메시지
  const colW = [1.4, 0.95, 1.0, 3.85, 2.45]; // 열 너비(합 9.65)
  const rowH = [0.3, 0.91, 0.91, 0.91, 0.91, 0.91, 0.91]; // 행 높이(머리글 + 6행)
  const wb = { l: sline(C.wht, 0.75), r: sline(C.wht, 0.75) }; // 머리글 흰 구분선
  const hd = ['품목', '가격', '전주비', '코멘터리', 'AI 전망'].map((t, i) => Cell([Pa(Rn(t, { sz: 9, b: true, c: C.wht }), { al: i >= 3 ? 'l' : 'c' })], { fill: C.blk, bd: wb, ins: [i >= 3 ? 0.1 : 0.04, 0.02, 0.04, 0.02] })); // 머리글 행
  const rows = [hd]; // 표 행 목록
  // 코멘터리·AI 전망 글자 크기: 6행 모두 들어가는 가장 큰 크기를 공통으로 사용
  const cw = colW[3] - 0.2, aw = colW[4] - 0.2, chMax = rowH[1] - 0.08; // 셀 안 가용 폭·높이
  const aiParas = (s, sz) => { // AI 전망 칸 문단(방향 한 줄 + 요약 문장)
    const pl = outlookPill(s.it.ai_outlook); // 방향 알약 정보
    if (!pl) return [Pa(Rn(s.it.ai_outlook ? aiGist(s.it.ai_outlook) : '(내용 없음)', { sz: sz, c: s.it.ai_outlook ? C.blk : 'A6A6A6' }))]; // 방향 없음
    return [Pa(Rn(pl.t, { sz: sz + 0.5, b: true, c: pl.c })), Pa(Rn(aiGist(s.it.ai_outlook), { sz: sz }))]; // 방향 + 요약
  };
  let csz = 8; // 시작 크기
  const sizes = [8, 7.5, 7, 6.5]; // 후보 크기
  for (let i = 0; i < sizes.length; i++) { // 큰 것부터
    csz = sizes[i]; // 후보
    const okAll = sts.every(s => measureH([Pa(Rn(s.it.commentary || '(내용 없음)', { sz: csz }))], cw, [0, 0, 0, 0]) <= chMax && measureH(aiParas(s, csz), aw, [0, 0, 0, 0]) <= chMax); // 두 칸 모두 들어가는지
    if (okAll) break; // 확정
    if (i === sizes.length - 1) warn.push('요약 코멘터리·AI 전망이 칸을 넘칩니다 (최소 글자 크기 적용)'); // 마지막까지 안 맞으면 경고
  }
  sts.forEach((s, ri) => { // 품목 행
    const m = s.meta; // 품목
    const dc = dirColor(s.dir); // 방향 색
    const bar = { l: sline(dc, 4) }; // 왼쪽 방향 막대(굵은 왼쪽 테두리)
    const c0 = Cell([Pa(Rn(m.code, { sz: 12, b: true })), Pa(Rn(m.ko, { sz: 8 })), Pa(Rn(m.bench, { sz: 7.5, c: C.gray }))], { bd: bar, ins: [0.12, 0.04, 0.04, 0.04] }); // 품목 칸
    const c1 = Cell([Pa(Rn(priceStr(s.price, m), { sz: 14, b: true }), { al: 'c' }), Pa(Rn(m.unit, { sz: 7.5, c: C.gray }), { al: 'c' })], {}); // 가격 칸
    const c2 = Cell([Pa(Rn(s.dir === 0 ? '–' : deltaText(s.d, m), { sz: 11, b: true, c: dc }), { al: 'c' }), Pa(Rn(isFinite(s.p) ? pctText(s.p, 2) : '–', { sz: 8, c: dc }), { al: 'c' })], {}); // 전주비 칸
    const c3 = Cell([Pa(Rn(s.it.commentary || '(내용 없음)', { sz: csz, c: s.it.commentary ? C.blk : 'A6A6A6' }))], { va: 'm', ins: [0.1, 0.04, 0.1, 0.04], bind: { kind: 'item', key: m.key, field: 'commentary' } }); // 코멘터리 칸
    const c4 = Cell(aiParas(s, csz), { va: 'm', ins: [0.1, 0.04, 0.1, 0.04] }); // AI 전망 칸(요약 표시 전용 — 전문은 각 품목 쪽에서 수정)
    rows.push([c0, c1, c2, c3, c4]); // 행 추가
    rows[rows.length - 1].go = ri + 1; // 클릭 시 이동할 쪽 번호(0부터, 요약이 0)
  });
  const tb = Tb(0.2, 1.36, colW, rowH, rows, { border: 'h', step: 1 }); // 요약 표
  els.push(tb); // 추가
  const fn = []; // 주석
  fn.push('※ 전주 대비 = 금주 − 전주 가격 (▲ 상승 빨강 · ▼ 하락 파랑 · – 보합 검정). 행을 누르면 해당 품목 쪽으로 이동. AI 전망은 첫 문장 요약이며 전문은 각 품목 쪽 ⑦ 참조.'); // 안내
  fn.push('기준 : ' + ITEMS.map(m => m.code + ' ' + m.bench).join(' / ') + '.'); // 기준
  sts.forEach(s => s.notes.forEach(n => fn.push(n))); // 검산 주석
  els.push(Tx(0.2, 7.2, 9.65, 0.26, [Pa(Rn(fn.join(' '), { sz: 7.5, c: C.gray }))], { va: 't' })); // 주석 상자
  return { id: 'summary', kind: 'summary', key: '', title: '요약', name: '요약', els, warn, notes: [] }; // 쪽 객체
}

// ───────────────────────── 9. 전체 쪽 목록 ─────────────────────────
function buildSlides(win, wk) { // 선택 주차의 전체 쪽 목록(요약 + 6개 품목)을 만드는 함수
  const out = [buildSummarySlide(win, wk)]; // 첫 장 요약
  ITEMS.forEach(m => out.push(buildItemSlide(m.key, win, wk))); // 품목별 1장
  out.forEach((s, i) => { s.no = i + 1; s.steps = s.els.reduce((a, e) => Math.max(a, e.step || 0), 0); }); // 번호·단계 수
  return out; // 쪽 목록
}

// ============================================================================
// 03_render.js — 화면 렌더러: 장면(scene)을 DOM/SVG 로 그린다 (+ 글 넘침 측정, 마스터, PNG 변환)
// 이 렌더러와 PPT 변환기(04_pptx.js)는 같은 장면 요소를 읽는다.
// ============================================================================

// ───────────────────────── 1. 단위 변환 ─────────────────────────
function px(inch) { return inch * PXI; } // 인치 → 화면 px
function ptpx(pt) { return pt * PXPT; } // pt → 화면 px
function chartDec(el, vals) { // 차트 라벨 소수 자릿수(화면·PPT 공통 규칙)
  if (el.dec === 2) return 2; // WTI 는 소수 2자리 고정
  const nonInt = (vals || []).some(v => isFinite(v) && Math.abs(v - Math.round(v)) > 1e-9); // 소수가 하나라도 있는지
  return nonInt ? 1 : 0; // 있으면 1자리, 없으면 정수
}
function fmtDec(v, d) { // 소수 d자리 + 천 단위 쉼표
  if (!isFinite(v)) return ''; // 값이 없으면 빈칸
  return v.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d }); // 변환
}

// ───────────────────────── 2. 문단 → HTML ─────────────────────────
function runHTML(r) { // 글자 조각 1개를 span 으로
  let st = 'font-size:' + ptpx(r.sz).toFixed(2) + 'px;color:#' + r.c + ';'; // 크기·색
  if (r.b) st += 'font-weight:700;'; // 굵게
  const deco = []; if (r.u) deco.push('underline'); if (r.s) deco.push('line-through'); // 밑줄·취소선
  if (deco.length) st += 'text-decoration:' + deco.join(' ') + ';'; // 장식선
  if (r.hl) st += 'background:#' + r.hl + ';'; // 형광펜
  return '<span style="' + st + '">' + (esc(r.t) || '​') + '</span>'; // 빈 조각은 폭 없는 문자로 높이 확보
}
function parasHTML(paras) { // 문단 목록 → HTML 문자열
  return (paras || []).map((p, i) => { // 문단마다
    const mx = Math.max.apply(null, p.runs.map(r => r.sz)); // 문단 안 최대 글자 크기
    const st = 'font-size:' + ptpx(mx).toFixed(2) + 'px;text-align:' + ({ l: 'left', c: 'center', r: 'right' }[p.al] || 'left') + ';' + (p.sp && i > 0 ? 'margin-top:' + ptpx(p.sp).toFixed(2) + 'px;' : ''); // 줄 높이 기준 크기·정렬·간격
    return '<div class="p' + (p.bul ? ' bul' : '') + '" data-pi="' + i + '" style="' + st + '">' + p.runs.map(runHTML).join('') + '</div>'; // 문단 div
  }).join(''); // 합치기
}
function measureH(paras, wIn, ins) { // 문단들이 차지하는 높이(인치)를 실제로 재는 함수 (자동 맞춤용)
  const box = document.getElementById('measure'); // 측정 영역
  const d = document.createElement('div'); // 임시 상자
  d.style.cssText = 'position:absolute;left:0;top:0;width:' + px(wIn - ins[0] - ins[2]).toFixed(2) + 'px;'; // 폭만 지정
  d.innerHTML = parasHTML(paras); // 문단 넣기
  box.appendChild(d); // 붙이기
  const h = d.getBoundingClientRect().height; // 높이 측정
  box.removeChild(d); // 치우기
  return h / PXI + ins[1] + ins[3]; // 인치로 환산 + 위아래 여백
}

// ───────────────────────── 3. 요소 → DOM ─────────────────────────
function baseBox(el) { // 요소 공통 상자(위치·크기)
  const d = document.createElement('div'); // div
  d.className = 'el'; // 공통 클래스
  d.style.left = px(el.x).toFixed(2) + 'px'; // x
  d.style.top = px(el.y).toFixed(2) + 'px'; // y
  d.style.width = px(el.w).toFixed(2) + 'px'; // 폭
  d.style.height = px(el.h).toFixed(2) + 'px'; // 높이
  return d; // 반환
}
function applyText(d, el) { // 글자 영역(여백·세로 정렬)을 적용
  const ins = el.ins || [0, 0, 0, 0]; // 여백
  d.style.padding = [ins[1], ins[2], ins[3], ins[0]].map(v => px(v).toFixed(2) + 'px').join(' '); // 위 오른 아래 왼
  d.style.justifyContent = { t: 'flex-start', m: 'center', b: 'flex-end' }[el.va] || 'flex-start'; // 세로 정렬
  d.innerHTML = '<div class="in">' + parasHTML(el.paras) + '</div>'; // 문단 넣기
}
function renderText(el) { // 텍스트 상자
  const d = baseBox(el); // 상자
  applyText(d, el); // 글자
  return d; // 반환
}
function renderShape(el) { // 도형(글자 포함)
  const d = baseBox(el); // 상자
  if (el.shp === 'line') { // 선은 SVG 로
    d.style.overflow = 'visible'; // 높이 0 이어도 보이게
    const lw = ptpx(el.line ? el.line.w : 1); // 선 굵기
    const y1 = el.flipV ? px(el.h) : 0, y2 = el.flipV ? 0 : px(el.h); // 뒤집힘 처리
    const dash = el.line && el.line.dash === 'dash' ? '8 5' : (el.line && el.line.dash === 'sysDot' ? '2 3' : ''); // 점선 종류
    d.innerHTML = '<svg style="position:absolute;left:0;top:0;overflow:visible" width="' + px(el.w).toFixed(2) + '" height="' + Math.max(1, px(el.h)).toFixed(2) + '"><line x1="0" y1="' + y1.toFixed(2) + '" x2="' + px(el.w).toFixed(2) + '" y2="' + y2.toFixed(2) + '" stroke="#' + (el.line ? el.line.c : '000000') + '" stroke-width="' + lw.toFixed(2) + '"' + (dash ? ' stroke-dasharray="' + dash + '"' : '') + '/></svg>'; // 선
    return d; // 반환
  }
  if (el.fill) d.style.background = '#' + el.fill; // 채움
  if (el.line) d.style.boxShadow = 'inset 0 0 0 ' + ptpx(el.line.w).toFixed(2) + 'px #' + el.line.c; // 테두리(레이아웃에 영향 없게 안쪽 그림자)
  if (el.shp === 'round') d.style.borderRadius = px(el.rad).toFixed(2) + 'px'; // 둥근 모서리(알약은 rad = 높이/2)
  if (el.shp === 'ellipse') d.style.borderRadius = '50%'; // 타원
  if (el.shp === 'diamond') d.style.clipPath = 'polygon(50% 0,100% 50%,50% 100%,0 50%)'; // 마름모
  if (el.paras) applyText(d, el); // 같은 도형 안의 글자
  return d; // 반환
}
function borderCss(b) { return b ? ptpx(b.w).toFixed(2) + 'px solid #' + b.c : 'none'; } // 선 서식 → CSS
function renderTable(el) { // 표(HTML table)
  const wrap = baseBox({ x: el.x, y: el.y, w: el.colW.reduce((a, b) => a + b, 0), h: el.rowH.reduce((a, b) => a + b, 0) }); // 바깥 상자
  wrap.style.overflow = 'visible'; // 표가 커져도 잘리지 않게
  const t = document.createElement('table'); // 표
  t.style.cssText = 'border-collapse:collapse;table-layout:fixed;width:' + px(el.colW.reduce((a, b) => a + b, 0)).toFixed(2) + 'px;'; // 고정 레이아웃
  let cg = '<colgroup>' + el.colW.map(w => '<col style="width:' + px(w).toFixed(2) + 'px">').join('') + '</colgroup>'; // 열 너비
  let body = ''; // 행 HTML
  el.rows.forEach((row, ri) => { // 행마다
    body += '<tr style="height:' + px(el.rowH[ri]).toFixed(2) + 'px"' + (row.go !== undefined ? ' data-go="' + row.go + '"' : '') + ' data-ri="' + ri + '">'; // 행 시작
    row.forEach((c, ci) => { // 셀마다
      let st = 'padding:' + [c.ins[1], c.ins[2], c.ins[3], c.ins[0]].map(v => px(v).toFixed(2) + 'px').join(' ') + ';vertical-align:' + ({ t: 'top', m: 'middle', b: 'bottom' }[c.va] || 'middle') + ';overflow:hidden;'; // 여백·세로 정렬
      if (c.fill) st += 'background:#' + c.fill + ';'; // 배경
      const mode = el.border; // 표 테두리 방식
      let bl = null, br = null, bt = null, bb = null; // 기본 테두리
      if (mode === 'cell') { bl = br = bt = bb = { c: C.line, w: 0.75 }; } // 셀별 개별
      else if (mode === 'all') { bl = br = bt = bb = { c: C.blk, w: 0.75 }; } // 전체
      else if (mode === 'h' && ri > 0) { bb = { c: C.line, w: 0.75 }; } // 가로선만(본문 아래선)
      if (c.bd.l) bl = c.bd.l; if (c.bd.r) br = c.bd.r; if (c.bd.t) bt = c.bd.t; if (c.bd.b) bb = c.bd.b; // 셀 지정 우선
      st += 'border-left:' + borderCss(bl) + ';border-right:' + borderCss(br) + ';border-top:' + borderCss(bt) + ';border-bottom:' + borderCss(bb) + ';'; // 테두리
      body += '<td data-ci="' + ci + '"' + (c.cs > 1 ? ' colspan="' + c.cs + '"' : '') + (c.rs > 1 ? ' rowspan="' + c.rs + '"' : '') + ' style="' + st + '">' + parasHTML(c.paras) + '</td>'; // 셀
    });
    body += '</tr>'; // 행 끝
  });
  t.innerHTML = cg + '<tbody>' + body + '</tbody>'; // 표 내용
  wrap.appendChild(t); // 붙이기
  Array.from(t.querySelectorAll('tr')).forEach((tr, ri) => { // 셀에 장면 참조 연결(편집용)
    Array.from(tr.children).forEach((td, ci) => { td._cell = el.rows[ri][ci]; td._bind = el.rows[ri][ci] ? el.rows[ri][ci].bind : null; }); // 연결
  });
  return wrap; // 반환
}
function svgText(x, y, s, o) { // SVG 글자 한 줄
  return '<text x="' + x.toFixed(2) + '" y="' + y.toFixed(2) + '" text-anchor="' + (o.anchor || 'middle') + '" font-size="' + ptpx(o.sz).toFixed(2) + '" fill="#' + o.c + '"' + (o.b ? ' font-weight="700"' : '') + '>' + esc(s) + '</text>'; // 글자
}
function renderChart(el) { // 차트(SVG)
  const d = baseBox(el); // 바깥 상자
  d.style.overflow = 'visible'; // 라벨이 살짝 넘쳐도 보이게
  const W = px(el.w), H = px(el.h); // 전체 크기(px)
  const pl = el.plot.x * W, pt = el.plot.y * H, pw = el.plot.w * W, ph = el.plot.h * H; // 플롯 영역
  const n = el.cats.length; // 범주 수
  const slot = pw / n; // 범주 한 칸 폭
  const yOf = v => pt + ph * (1 - (v - el.min) / (el.max - el.min)); // 값 → y
  const allVals = []; el.series.forEach(s => s.vals.forEach(v => allVals.push(v))); // 모든 값
  const dec = chartDec(el, el.series.filter(s => s.labels).reduce((a, s) => a.concat(s.vals), [])); // 라벨 소수 자릿수
  let g = ''; // SVG 내용
  g += '<line x1="' + pl.toFixed(2) + '" y1="' + (pt + ph).toFixed(2) + '" x2="' + (pl + pw).toFixed(2) + '" y2="' + (pt + ph).toFixed(2) + '" stroke="#BFBFBF" stroke-width="' + ptpx(0.75).toFixed(2) + '"/>'; // 범주 축선
  el.cats.forEach((c, i) => { g += svgText(pl + slot * (i + 0.5), pt + ph + ptpx(8) + 6, c, { sz: 8, c: '404040' }); }); // 범주 라벨(아래쪽)
  el.series.filter(s => s.kind === 'bar').forEach(s => { // 막대 먼저
    const bw = slot / (1 + (el.gap || 60) / 100); // 막대 폭
    s.vals.forEach((v, i) => { // 막대마다
      if (!isFinite(v)) return; // 값 없으면 건너뜀
      const y = yOf(v), col = (s.ptColors && s.ptColors[i]) || s.color; // 위치·색
      g += '<rect x="' + (pl + slot * i + (slot - bw) / 2).toFixed(2) + '" y="' + y.toFixed(2) + '" width="' + bw.toFixed(2) + '" height="' + Math.max(0, pt + ph - y).toFixed(2) + '" fill="#' + col + '"/>'; // 막대
      if (s.labels) g += svgText(pl + slot * (i + 0.5), y - 5, fmtDec(v, dec), { sz: s.labels.sz, b: s.labels.b, c: s.labels.c }); // 바깥 끝 라벨
    });
  });
  el.series.filter(s => s.kind === 'line').forEach(s => { // 선
    const pts = s.vals.map((v, i) => isFinite(v) ? [pl + slot * (i + 0.5), yOf(v)] : null); // 점 좌표
    const ok = pts.filter(Boolean); // 유효한 점
    const dash = s.dash === 'dash' ? ' stroke-dasharray="9 6"' : ''; // 점선
    g += '<polyline fill="none" stroke="#' + s.color + '" stroke-width="' + ptpx(s.lw || 2).toFixed(2) + '"' + dash + ' points="' + ok.map(p => p[0].toFixed(2) + ',' + p[1].toFixed(2)).join(' ') + '"/>'; // 선
    ok.forEach((p, i) => { // 마커·라벨
      if (s.marker) g += '<circle cx="' + p[0].toFixed(2) + '" cy="' + p[1].toFixed(2) + '" r="' + ptpx(5).toFixed(2) + '" fill="#FFFFFF" stroke="#' + s.color + '" stroke-width="' + ptpx(1.75).toFixed(2) + '"/>'; // 흰 채움 원형 마커
      if (s.labels) g += svgText(p[0], p[1] - (s.marker ? ptpx(5) + 5 : 5), fmtDec(s.vals[pts.indexOf(p)], dec), { sz: s.labels.sz, b: s.labels.b, c: s.labels.c }); // 위쪽 라벨
    });
  });
  d.innerHTML = '<svg width="' + W.toFixed(2) + '" height="' + H.toFixed(2) + '" viewBox="0 0 ' + W.toFixed(2) + ' ' + H.toFixed(2) + '" style="overflow:visible;position:absolute;left:0;top:0">' + g + '</svg>'; // SVG
  return d; // 반환
}
function renderEl(el, opt) { // 요소 1개 → DOM
  let d; // 결과
  if (el.t === 'text') d = renderText(el); // 글자
  else if (el.t === 'shape') d = renderShape(el); // 도형
  else if (el.t === 'table') d = renderTable(el); // 표
  else if (el.t === 'chart') d = renderChart(el); // 차트
  else throw new Error('알 수 없는 요소 종류입니다'); // 한글 오류
  d._el = el; // 장면 참조 연결(편집·발표용)
  d.dataset.s = String(el.step || 0); // 등장 단계
  if (!opt.all && (el.step || 0) > opt.stepNo) d.classList.add('step-hide'); // 아직 안 나타날 요소
  if (el.bind && opt.edit) { // 편집 모드에서 점선 칸 표시
    if (el.t === 'shape' && el.bind.para !== undefined) { const p = d.querySelectorAll('.p')[el.bind.para]; if (p) { p.classList.add('editable'); p._bind = el.bind; } } // 문단 하나만 편집
    else { d.classList.add('editable'); d._bind = el.bind; } // 요소 전체 편집
  }
  if (el.t === 'table' && opt.edit) d.querySelectorAll('td').forEach(td => { if (td._bind) td.classList.add('editable'); }); // 표 셀 편집 표시
  return d; // 반환
}
function renderPage(slide, opt) { // 한 쪽(.page) 만들기. opt: {stepNo, edit, all}
  const o = Object.assign({ stepNo: 0, edit: false, all: false }, opt || {}); // 기본값
  const page = document.createElement('div'); // 쪽 상자
  page.className = 'page'; // 클래스
  slide.els.forEach(el => { try { page.appendChild(renderEl(el, o)); } catch (e) { console.error(e); toast('요소를 그리지 못했습니다 : ' + e.message); } }); // 요소 그리기
  return page; // 반환
}
function checkTableOverlap(page, slide) { // 표가 계획보다 커져서 아래 요소와 겹치는지 검사 (화면 글꼴 차이 대비)
  const warns = []; // 경고
  page.querySelectorAll('.el').forEach(d => { // 요소마다
    if (!d._el || d._el.t !== 'table') return; // 표만
    const t = d.querySelector('table'); // 표 DOM
    const real = t.getBoundingClientRect().height / (page.getBoundingClientRect().width / 1600) / PXI; // 실제 높이(인치, 배율 보정)
    const plan = d._el.rowH.reduce((a, b) => a + b, 0); // 계획 높이
    if (real > plan + 0.03) warns.push('표 높이가 계획보다 ' + (real - plan).toFixed(2) + 'in 커졌습니다 (' + slide.name + ') — 글자 크기·행 높이 확인 필요'); // 경고
  });
  return warns; // 반환
}

// ───────────────────────── 4. 마스터(구분선 + 장식 3개) ─────────────────────────
function masterNode() { // 마스터 층 DOM — 쪽 전환 중에도 고정
  const m = document.createElement('div'); // 컨테이너
  m.style.cssText = 'position:absolute;inset:0;'; // 전체 덮기
  const ln = document.createElement('div'); // 구분선
  ln.style.cssText = 'position:absolute;left:0;width:1600px;top:' + (px(0.752) - ptpx(1) / 2).toFixed(2) + 'px;height:' + ptpx(1).toFixed(2) + 'px;background:#' + C.navy + ';'; // 남색 1pt
  m.appendChild(ln); // 추가
  [['diamond', 8.958], ['circle', 9.231], ['round', 9.505]].forEach(a => { // 장식 3개
    const im = document.createElement('img'); // 그림
    im.src = 'data:image/png;base64,' + (DECO[a[0]] || ''); // 내장 PNG
    im.style.cssText = 'position:absolute;left:' + px(a[1]).toFixed(2) + 'px;top:' + px(0.6595 - 0.0925).toFixed(2) + 'px;width:' + px(0.185).toFixed(2) + 'px;height:' + px(0.185).toFixed(2) + 'px;'; // 0.185in
    m.appendChild(im); // 추가
  });
  return m; // 반환
}
function drawMaster() { // 마스터 층에 그리기
  const ml = document.getElementById('masterLayer'); // 마스터 층
  ml.innerHTML = ''; // 비우기
  ml.appendChild(masterNode()); // 마스터 그리기
}

// ───────────────────────── 5. 화면 배율 ─────────────────────────
function fitStage() { // 창 크기에 맞춰 1600×1194 캔버스를 축소·중앙 배치
  const vp = document.getElementById('viewport'); // 영역
  const st = document.getElementById('stage'); // 캔버스
  const vw = vp.clientWidth, vh = vp.clientHeight; // 영역 크기
  const sc = Math.min(vw / 1600, vh / 1194); // 배율
  const ox = (vw - 1600 * sc) / 2, oy = (vh - 1194 * sc) / 2; // 중앙 정렬 여백
  st.style.transform = 'translate(' + ox.toFixed(2) + 'px,' + oy.toFixed(2) + 'px) scale(' + sc.toFixed(5) + ')'; // 변환
  st.dataset.scale = String(sc); // 배율 기록(레이저·클릭 좌표용)
  st.dataset.ox = String(ox); st.dataset.oy = String(oy); // 오프셋 기록
  return sc; // 배율 반환
}

// ───────────────────────── 6. PNG 변환 (마스터 포함) ─────────────────────────
function slideToXhtml(slide) { // 쪽 + 마스터를 하나의 XHTML 문자열로
  const stage = document.createElement('div'); // 임시 캔버스
  stage.id = 'stage'; // 같은 CSS 적용
  stage.style.cssText = 'position:relative;transform:none;box-shadow:none;width:1600px;height:1194px;background:#fff;'; // 크기
  const pl = document.createElement('div'); pl.id = 'pageLayer'; pl.appendChild(renderPage(slide, { all: true })); // 쪽 층
  const ml = document.createElement('div'); ml.id = 'masterLayer'; ml.appendChild(masterNode()); // 마스터 층
  stage.appendChild(pl); stage.appendChild(ml); // 조립
  stage.setAttribute('xmlns', 'http://www.w3.org/1999/xhtml'); // XHTML 이름공간
  const css = Array.from(document.querySelectorAll('style')).map(s => s.textContent).join('\n'); // 현재 CSS
  const body = new XMLSerializer().serializeToString(stage); // 유효한 XML 로 직렬화
  return '<div xmlns="http://www.w3.org/1999/xhtml" style="font-family:\'Malgun Gothic\',\'맑은 고딕\',\'Noto Sans CJK KR\',\'Noto Sans KR\',sans-serif"><style><![CDATA[' + css + ']]></style>' + body + '</div>'; // 결과
}
async function slideToPngBlob(slide, wpx, hpx, mime, quality) { // 쪽 → 이미지 Blob (기본 PNG 3060×2284, mime 으로 JPEG 선택 가능)
  try { // 실패하면 한글 안내
    const W = wpx || 3060, H = hpx || 2284; // 출력 크기
    const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1194"><foreignObject x="0" y="0" width="1600" height="1194">' + slideToXhtml(slide) + '</foreignObject></svg>'; // SVG 포장
    const img = new Image(); // 이미지 객체
    const loaded = new Promise((res, rej) => { img.onload = res; img.onerror = () => rej(new Error('이미지 변환에 실패했습니다')); }); // 로드 대기
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg); // 로드 시작
    await loaded; // 대기
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H; // 캔버스
    const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, W, H); // 흰 바탕
    cx.drawImage(img, 0, 0, W, H); // 그리기
    return await new Promise((res, rej) => cv.toBlob(b => b ? res(b) : rej(new Error('이미지 변환에 실패했습니다')), mime || 'image/png', quality)); // Blob
  } catch (e) { // 오류
    console.error(e); // 기록
    throw new Error('이미지 변환에 실패했습니다. 브라우저를 최신 버전으로 사용해 주세요.'); // 한글 안내
  }
}

// ============================================================================
// 04_pptx.js — PPT 저장: 장면(scene)을 PptxGenJS 네이티브 개체로 바꾸고 JSZip 으로 후처리한다
// 파이프라인(고정 순서): ① 장면 확정 → ② PptxGenJS 슬라이드 생성 → ③ JSZip 후처리
//                       (patchCharts → 내장 엑셀 빈 값 제거 → 마스터 삽입) → ④ Blob 다운로드
// 그래프·표·카드는 이미지로 붙이지 않는다. 글자는 해당 도형/표/텍스트 상자 안에 넣는다.
// ============================================================================

const FACE = 'Malgun Gothic'; // PPT 에는 이 글꼴만 기록
const EMU = 914400; // 1인치 = 914400 EMU
class PptxStageError extends Error { // 어느 단계에서 실패했는지 알리기 위한 오류
  constructor(stage, msg) { super(msg); this.stage = stage; } // 단계 이름 기록
}

// ───────────────────────── 1. 글자(run·문단) 변환 ─────────────────────────
function pptRuns(paras) { // 장면 문단 목록 → PptxGenJS 글자 배열 (한 상자에 모든 문단·조각을 담는다)
  const out = []; // 결과
  (paras || []).forEach((p, pi) => { // 문단마다
    const lastPara = pi === paras.length - 1; // 마지막 문단 여부
    p.runs.forEach((r, ri) => { // 조각마다
      const o = { fontFace: FACE, fontSize: r.sz, bold: !!r.b, color: r.c, align: ({ l: 'left', c: 'center', r: 'right' })[p.al] || 'left', lineSpacingMultiple: 0.95 }; // 조각 서식 + 문단 서식
      if (r.u) o.underline = { style: 'sng', color: r.c }; // 밑줄
      if (r.s) o.strike = 'sngStrike'; // 취소선
      if (r.hl) o.highlight = r.hl; // 형광펜
      if (p.bul) o.bullet = { indent: 9.4 }; // 글머리표(0.13in = 9.4pt)
      if (p.sp && pi > 0) o.paraSpaceBefore = p.sp; // 문단 앞 간격
      if (ri === p.runs.length - 1 && !lastPara) o.breakLine = true; // 문단 끝에서 줄바꿈
      out.push({ text: r.t === '' ? ' ' : r.t, options: o }); // 조각 추가
    });
  });
  return out; // 반환
}
function marginPts(ins) { // 인치 여백 [왼,위,오,아래] → PptxGenJS [왼,오,아래,위] (pt)
  const f = v => Math.max(0, v * 72); // 인치 → pt
  return [f(ins[0]), f(ins[2]), f(ins[3]), f(ins[1])]; // 순서 변환
}
function lineOpt(l) { // 선 서식 변환
  if (!l) return undefined; // 선 없음
  return { color: l.c, width: l.w, dashType: l.dash === 'dash' ? 'dash' : (l.dash === 'sysDot' ? 'sysDot' : 'solid') }; // 선 옵션
}

// ───────────────────────── 2. 텍스트·도형 ─────────────────────────
function addTextEl(pptx, slide, el) { // 텍스트 상자 1개
  slide.addText(pptRuns(el.paras), { x: el.x, y: el.y, w: Math.max(el.w, 0.01), h: Math.max(el.h, 0.01), margin: marginPts(el.ins || [0, 0, 0, 0]), valign: { t: 'top', m: 'middle', b: 'bottom' }[el.va] || 'top', fit: 'none', wrap: true, fontFace: FACE, autoFit: false }); // 텍스트 상자
}
function addShapeEl(pptx, slide, el) { // 도형 1개(글자가 있으면 같은 도형 안에)
  const T = pptx.ShapeType; // 도형 종류표
  const shapeType = { rect: T.rect, round: T.roundRect, ellipse: T.ellipse, diamond: T.diamond, line: T.line, bracket: T.rightBracket }[el.shp] || T.rect; // 종류 선택
  const w = Math.max(el.w, el.shp === 'line' ? 0.0001 : 0.01), h = Math.max(el.h, el.shp === 'line' ? 0.0001 : 0.01); // 최소 크기 보장(두께 0 오류 방지)
  const o = { x: el.x, y: el.y, w, h }; // 기본 위치·크기
  if (el.fill) o.fill = { color: el.fill }; else if (el.shp !== 'line') o.fill = { type: 'none' }; // 채움
  if (el.line) o.line = lineOpt(el.line); else if (el.shp !== 'line') o.line = { type: 'none' }; // 테두리
  if (el.flipV) o.flipV = true; // 오른쪽 위로 향하는 선
  if (el.shp === 'round') o.rectRadius = Math.min(el.rad, Math.min(w, h) / 2); // 모서리 반경(인치) — 알약은 높이의 절반
  if (el.paras && el.shp !== 'line') { // 글자가 들어 있는 도형
    Object.assign(o, { shape: shapeType, margin: marginPts(el.ins), valign: { t: 'top', m: 'middle', b: 'bottom' }[el.va] || 'middle', fit: 'none', wrap: true, fontFace: FACE }); // 텍스트 + 도형 일체
    slide.addText(pptRuns(el.paras), o); // 글자 포함 도형
  } else { // 글자 없는 도형
    slide.addShape(shapeType, o); // 도형만
  }
}

// ───────────────────────── 3. 표 ─────────────────────────
function cellBorder(el, ri, c) { // 셀 테두리 [위,오른,아래,왼] 만들기
  const none = { type: 'none' }; // 없음
  const mk = b => b ? { type: 'solid', pt: b.w, color: b.c } : none; // 선 → PptxGenJS 테두리
  let t = null, r = null, b = null, l = null; // 기본
  if (el.border === 'cell') t = r = b = l = { c: C.line, w: 0.75 }; // 셀별 개별
  else if (el.border === 'all') t = r = b = l = { c: C.blk, w: 0.75 }; // 전체
  else if (el.border === 'h' && ri > 0) b = { c: C.line, w: 0.75 }; // 가로선만
  if (c.bd.t) t = c.bd.t; if (c.bd.r) r = c.bd.r; if (c.bd.b) b = c.bd.b; if (c.bd.l) l = c.bd.l; // 셀 지정 우선
  return [mk(t), mk(r), mk(b), mk(l)]; // 위·오른·아래·왼
}
function addTableEl(pptx, slide, el) { // 표 1개 (PPT 표 개체)
  const rows = el.rows.map((row, ri) => row.map(c => { // 행·셀 변환
    const opt = { valign: { t: 'top', m: 'middle', b: 'bottom' }[c.va] || 'middle', margin: marginPts(c.ins).map(v => Math.max(1, v)), border: cellBorder(el, ri, c), fontFace: FACE }; // 셀 옵션(여백 최소 1pt)
    if (c.fill) opt.fill = { color: c.fill }; // 배경
    if (c.cs > 1) opt.colspan = c.cs; // 가로 병합
    if (c.rs > 1) opt.rowspan = c.rs; // 세로 병합
    return { text: pptRuns(c.paras), options: opt }; // 셀
  }));
  slide.addTable(rows, { x: el.x, y: el.y, colW: el.colW, rowH: el.rowH, autoPage: false, fontFace: FACE, margin: 0 }); // 표 생성(자동 페이지 분할 끔)
}

// ───────────────────────── 4. 차트(틀 생성) ─────────────────────────
function chartFmt(dec) { return dec === 2 ? '#,##0.00' : (dec === 1 ? '#,##0.0' : '#,##0'); } // 라벨 숫자 서식
function addChartEl(pptx, slide, el, specs) { // 차트 틀 생성 + 후처리용 명세 기록
  const bars = el.series.filter(s => s.kind === 'bar'), lines = el.series.filter(s => s.kind === 'line'); // 종류별 계열
  const labelled = el.series.filter(s => s.labels); // 라벨이 있는 계열
  const dec = chartDec(el, labelled.reduce((a, s) => a.concat(s.vals), [])); // 소수 자릿수(화면과 동일 규칙)
  const base = { x: el.x, y: el.y, w: el.w, h: el.h, showLegend: false, valAxisHidden: true, valAxisMinVal: el.min, valAxisMaxVal: el.max, valGridLine: { style: 'none' }, catGridLine: { style: 'none' }, catAxisLabelFontFace: FACE, catAxisLabelFontSize: 8, catAxisLabelColor: '404040', catAxisLabelPos: 'low', catAxisLineShow: true, layout: { x: el.plot.x, y: el.plot.y, w: el.plot.w, h: el.plot.h }, plotArea: { fill: { color: 'FFFFFF', transparency: 100 } }, dataLabelFontFace: FACE }; // 공통 옵션
  const lab = (labelled[0] && labelled[0].labels) || null; // 라벨 서식
  if (lab) Object.assign(base, { showValue: true, dataLabelFontSize: lab.sz, dataLabelFontBold: !!lab.b, dataLabelColor: lab.c, dataLabelFormatCode: chartFmt(dec) }); // 라벨 옵션
  const data = el.series.map(s => ({ name: s.name, labels: el.cats, values: s.vals })); // 데이터(내장 엑셀로 들어감)
  let type; // 차트 종류
  if (bars.length) { // 막대(+선은 후처리에서 이동)
    type = pptx.charts.BAR; // 막대
    Object.assign(base, { barDir: 'col', barGrouping: 'clustered', barGapWidthPct: el.gap || 60, chartColors: bars[0].ptColors || [bars[0].color], dataLabelPosition: 'outEnd' }); // 막대 옵션
    if (bars[0].ptColors) base.chartColors = bars[0].ptColors; // 점별 색
  } else { // 선만
    type = pptx.charts.LINE; // 선
    Object.assign(base, { chartColors: [lines[0].color], lineSize: lines[0].lw, lineDataSymbol: 'circle', lineDataSymbolSize: 10, lineDataSymbolLineSize: 1.75, lineDataSymbolLineColor: lines[0].color, lineSmooth: false, dataLabelPosition: 't' }); // 선 옵션(마커 원형 크기 10)
  }
  slide.addChart(type, data, base); // 차트 틀 생성
  specs.push({ el, firstName: el.series[0].name, hasBars: bars.length > 0, lines: bars.length ? lines : [], ptColors: bars.length ? bars[0].ptColors : null }); // 후처리 명세
}

// ───────────────────────── 5. 쪽 → 슬라이드 ─────────────────────────
function addSlideFromScene(pptx, slideScene, specs) { // 쪽 1장을 슬라이드로
  const s = pptx.addSlide(); // 슬라이드
  s.background = { color: 'FFFFFF' }; // 흰 바탕
  slideScene.els.forEach(el => { // 요소 순서대로(뒤→앞)
    if (el.t === 'text') addTextEl(pptx, s, el); // 글자
    else if (el.t === 'shape') addShapeEl(pptx, s, el); // 도형
    else if (el.t === 'table') addTableEl(pptx, s, el); // 표
    else if (el.t === 'chart') addChartEl(pptx, s, el, specs); // 차트
  });
}

// ───────────────────────── 6. 후처리 ① 차트 XML ─────────────────────────
function esc2(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); } // XML 이스케이프
function lineSerXml(s, idx, srcXml) { // 막대 계열을 선 계열로 다시 쓰는 XML (※보조 6주 평균)
  const tx = (/<c:tx>[\s\S]*?<\/c:tx>/.exec(srcXml) || [''])[0]; // 이름
  const cat = (/<c:cat>[\s\S]*?<\/c:cat>/.exec(srcXml) || [''])[0]; // 범주
  const val = (/<c:val>[\s\S]*?<\/c:val>/.exec(srcXml) || [''])[0]; // 값
  const dash = s.dash === 'dash' ? '<a:prstDash val="dash"/>' : '<a:prstDash val="solid"/>'; // 점선
  return '<c:ser><c:idx val="' + idx + '"/><c:order val="' + idx + '"/>' + tx + '<c:spPr><a:ln w="' + Math.round((s.lw || 1.25) * 12700) + '" cap="rnd"><a:solidFill><a:srgbClr val="' + s.color + '"/></a:solidFill>' + dash + '<a:round/></a:ln></c:spPr><c:marker><c:symbol val="none"/></c:marker>' + cat + val + '<c:smooth val="0"/></c:ser>'; // 계열 XML(스키마 순서 준수)
}
function patchChartXml(xml, spec) { // 차트 XML 하나를 고쳐 쓴다
  let x = xml; // 작업본
  if (spec.hasBars && spec.lines.length) { // 막대 + 보조 선(6주 평균)
    const sers = x.match(/<c:ser>[\s\S]*?<\/c:ser>/g) || []; // 계열 목록
    if (sers.length < 1 + spec.lines.length) throw new Error('차트 계열 수가 맞지 않습니다'); // 검증
    const moved = sers.slice(1); // 막대 뒤 계열은 선으로 이동
    moved.forEach(m => { x = x.replace(m, ''); }); // 막대 차트에서 제거
    const ax = (/<c:barChart>[\s\S]*?(<c:axId val="\d+"\/>\s*<c:axId val="\d+"\/>)[\s\S]*?<\/c:barChart>/.exec(x) || [])[1]; // 축 ID 재사용(보조축 없이)
    if (!ax) throw new Error('차트 축 정보를 찾을 수 없습니다'); // 검증
    const lineChart = '<c:lineChart><c:grouping val="standard"/><c:varyColors val="0"/>' + moved.map((m, i) => lineSerXml(spec.lines[i], i + 1, m)).join('') + '<c:marker val="1"/>' + ax + '</c:lineChart>'; // 선 차트
    x = x.replace('</c:barChart>', '</c:barChart>' + lineChart); // 막대 차트 바로 뒤에 삽입
    if (spec.ptColors && !/<c:dPt>/.test(x)) { // 계열이 2개 이상이면 PptxGenJS 가 점별 색을 넣지 않으므로 직접 추가
      const dpts = spec.ptColors.map((c, i) => '<c:dPt><c:idx val="' + i + '"/><c:invertIfNegative val="0"/><c:bubble3D val="0"/><c:spPr><a:solidFill><a:srgbClr val="' + c + '"/></a:solidFill></c:spPr></c:dPt>').join(''); // 점별 색 XML
      x = x.replace(/(<c:barChart>[\s\S]*?)<\/c:ser>/, '$1' + dpts + '</c:ser>'); // 첫 막대 계열 끝에 추가(순서는 뒤에서 재정렬)
    }
  }
  x = x.replace(/<c:marker>([\s\S]*?)<\/c:marker>/g, (all, inner) => { // 마커 채움을 흰색으로(테두리는 선 색 유지)
    if (/c:symbol val="none"/.test(inner)) return all; // 마커 없음은 그대로
    return '<c:marker>' + inner.replace(/(<c:spPr>\s*)<a:solidFill>[\s\S]*?<\/a:solidFill>/, '$1<a:solidFill><a:srgbClr val="FFFFFF"/></a:solidFill>') + '</c:marker>'; // 흰 채움
  });
  x = x.replace(/<c:dLbls>[\s\S]*?<\/c:dLbls>/g, m => m.replace(/<a:bodyPr\s*\/>/g, '<a:bodyPr rot="0" vert="horz" wrap="none" anchor="ctr" anchorCtr="1"/>')); // 데이터 라벨은 줄바꿈 없이 한 줄로
  return x; // 반환
}
function reorderSeries(xml) { // 계열(ser) 안 요소를 OOXML 스키마 순서로 재정렬하고 선 차트의 invertIfNegative 를 제거
  const NS = 'http://schemas.openxmlformats.org/drawingml/2006/chart'; // 차트 이름공간
  const ORD = { barChart: ['idx', 'order', 'tx', 'spPr', 'invertIfNegative', 'pictureOptions', 'dPt', 'dLbls', 'trendline', 'errBars', 'cat', 'val', 'shape', 'extLst'], lineChart: ['idx', 'order', 'tx', 'spPr', 'marker', 'dPt', 'dLbls', 'trendline', 'errBars', 'cat', 'val', 'smooth', 'extLst'] }; // 종류별 순서
  const doc = new DOMParser().parseFromString(xml, 'application/xml'); // XML 파싱
  if (doc.getElementsByTagName('parsererror').length) throw new Error('차트 XML 을 해석할 수 없습니다'); // 파싱 오류
  ['barChart', 'lineChart'].forEach(kind => { // 종류마다
    Array.from(doc.getElementsByTagNameNS(NS, kind)).forEach(ch => { // 차트마다
      Array.from(ch.childNodes).filter(n => n.localName === 'ser').forEach(ser => { // 계열마다
        let kids = Array.from(ser.childNodes).filter(n => n.nodeType === 1); // 요소 자식
        if (kind === 'lineChart') kids = kids.filter(n => { if (n.localName === 'invertIfNegative') { ser.removeChild(n); return false; } return true; }); // 선 계열에는 없는 요소 제거
        const rank = n => { const i = ORD[kind].indexOf(n.localName); return i < 0 ? 99 : i; }; // 순서 번호
        kids.map((n, i) => ({ n, i })).sort((a, b) => rank(a.n) - rank(b.n) || a.i - b.i).forEach(o => ser.appendChild(o.n)); // 정렬 후 다시 붙이기
      });
    });
  });
  const out = new XMLSerializer().serializeToString(doc); // 문자열로
  return /^<\?xml/.test(out) ? out : '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' + out; // 선언 보장
}
async function patchCharts(zip, specs) { // 모든 차트 XML 교체 (순서·개수 검증 포함)
  const names = Object.keys(zip.files).filter(n => /^ppt\/charts\/chart\d+\.xml$/.test(n)).sort((a, b) => parseInt(a.match(/(\d+)\.xml/)[1]) - parseInt(b.match(/(\d+)\.xml/)[1])); // 차트 파일(번호순)
  if (names.length !== specs.length) throw new PptxStageError('차트 교체', '차트 개수가 맞지 않습니다 (예상 ' + specs.length + ', 실제 ' + names.length + ')'); // 개수 검증
  for (let i = 0; i < names.length; i++) { // 차트마다
    const xml = await zip.file(names[i]).async('string'); // 원본 XML
    const first = (/<c:ser>[\s\S]*?<c:tx>[\s\S]*?<c:v>([\s\S]*?)<\/c:v>/.exec(xml) || [])[1]; // 첫 시리즈 이름
    if (first === undefined || first.replace(/&amp;/g, '&') !== specs[i].firstName) throw new PptxStageError('차트 교체', '차트 순서 검증에 실패했습니다 (' + (i + 1) + '번째 차트)'); // 순서 검증
    zip.file(names[i], reorderSeries(patchChartXml(xml, specs[i]))); // 교체 + 스키마 순서 정렬 후 저장
  }
}

// ───────────────────────── 7. 후처리 ② 내장 엑셀 ─────────────────────────
async function patchEmbeddedWorkbooks(zip) { // 내장 엑셀의 빈 값 칸(<v></v>) 제거 — "데이터 편집" 정상 동작용
  const names = Object.keys(zip.files).filter(n => /^ppt\/embeddings\/.*\.xlsx$/.test(n)); // 내장 엑셀
  for (const n of names) { // 파일마다
    const inner = await JSZip.loadAsync(await zip.file(n).async('uint8array')); // 엑셀 열기
    const sheets = Object.keys(inner.files).filter(f => /^xl\/worksheets\/sheet\d+\.xml$/.test(f)); // 시트들
    for (const sf of sheets) { // 시트마다
      let sx = await inner.file(sf).async('string'); // 시트 XML
      sx = sx.replace(/<c ([^>]*?)>\s*<v>\s*<\/v>\s*<\/c>/g, '<c $1/>').replace(/<v>\s*<\/v>/g, ''); // 빈 값 제거
      inner.file(sf, sx); // 저장
    }
    zip.file(n, await inner.generateAsync({ type: 'uint8array', compression: 'DEFLATE' })); // 다시 압축
  }
}

// ───────────────────────── 8. 후처리 ③ 슬라이드 마스터 ─────────────────────────
function emuOf(inch) { return Math.round(inch * EMU); } // 인치 → EMU
async function injectMaster(zip) { // slideMaster1.xml 에 구분선 1개 + 장식 그림 3개 삽입
  const mp = 'ppt/slideMasters/slideMaster1.xml', rp = 'ppt/slideMasters/_rels/slideMaster1.xml.rels'; // 경로
  if (!zip.file(mp)) throw new PptxStageError('마스터 삽입', '슬라이드 마스터를 찾을 수 없습니다'); // 한글 오류
  let mx = await zip.file(mp).async('string'); // 마스터 XML
  let rx = zip.file(rp) ? await zip.file(rp).async('string') : '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"></Relationships>'; // 관계 파일
  const decos = [['diamond', 8.958, '빨강 마름모'], ['circle', 9.231, '남색 원'], ['round', 9.505, '연두 둥근사각형']]; // 장식 3개
  let shapes = '<p:cxnSp><p:nvCxnSpPr><p:cNvPr id="9001" name="마스터 구분선"/><p:cNvCxnSpPr/><p:nvPr userDrawn="1"/></p:nvCxnSpPr><p:spPr><a:xfrm><a:off x="0" y="' + emuOf(0.752) + '"/><a:ext cx="' + emuOf(PAGE_W) + '" cy="0"/></a:xfrm><a:prstGeom prst="line"><a:avLst/></a:prstGeom><a:ln w="12700"><a:solidFill><a:srgbClr val="0C4270"/></a:solidFill></a:ln></p:spPr></p:cxnSp>'; // 구분선(남색 1pt)
  let rels = ''; // 추가할 관계
  decos.forEach((d, i) => { // 장식마다
    const rid = 'rIdDeco' + (i + 1), file = 'masterDeco' + (i + 1) + '.png'; // 관계 ID·파일명
    zip.file('ppt/media/' + file, DECO[d[0]] || '', { base64: true }); // PNG 저장
    rels += '<Relationship Id="' + rid + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="../media/' + file + '"/>'; // 관계
    shapes += '<p:pic><p:nvPicPr><p:cNvPr id="' + (9002 + i) + '" name="마스터 장식 ' + d[2] + '"/><p:cNvPicPr><a:picLocks noChangeAspect="1"/></p:cNvPicPr><p:nvPr userDrawn="1"/></p:nvPicPr><p:blipFill><a:blip r:embed="' + rid + '"/><a:stretch><a:fillRect/></a:stretch></p:blipFill><p:spPr><a:xfrm><a:off x="' + emuOf(d[1]) + '" y="' + emuOf(0.6595 - 0.0925) + '"/><a:ext cx="' + emuOf(0.185) + '" cy="' + emuOf(0.185) + '"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></p:spPr></p:pic>'; // 그림
  });
  if (!/<\/p:grpSpPr>/.test(mx)) throw new PptxStageError('마스터 삽입', '슬라이드 마스터를 찾을 수 없습니다'); // 구조 검증
  mx = mx.replace('</p:grpSpPr>', '</p:grpSpPr>' + shapes); // 도형 트리 맨 뒤쪽(아래층)에 삽입
  if (!/xmlns:r=/.test(mx.slice(0, 600))) mx = mx.replace('<p:sldMaster ', '<p:sldMaster xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" '); // r 이름공간 보장
  rx = rx.replace('</Relationships>', rels + '</Relationships>'); // 관계 추가
  zip.file(mp, mx); zip.file(rp, rx); // 저장
  let ct = await zip.file('[Content_Types].xml').async('string'); // 콘텐츠 형식
  if (!/Extension="png"/i.test(ct)) { ct = ct.replace('<Types ', '<Types ').replace(/(<Types[^>]*>)/, '$1<Default Extension="png" ContentType="image/png"/>'); zip.file('[Content_Types].xml', ct); } // png 등록 확인
  const lays = Object.keys(zip.files).filter(n => /^ppt\/slideLayouts\/slideLayout\d+\.xml$/.test(n)); // 레이아웃들
  for (const ln of lays) { // 마스터 도형을 숨기지 않는지 확인
    const lx = await zip.file(ln).async('string'); // 레이아웃 XML
    if (/showMasterSp="0"/.test(lx)) zip.file(ln, lx.replace(/showMasterSp="0"/g, 'showMasterSp="1"')); // 숨김 해제
  }
}

// ───────────────────────── 9. 전체 파이프라인 ─────────────────────────
async function buildPptxBlob(slides) { // 쪽 목록 → .pptx Blob
  let stage = '장면 확정'; // 현재 단계(오류 안내용)
  try { // 어느 단계든 실패하면 단계명과 함께 한글 오류
    if (typeof PptxGenJS === 'undefined' || typeof JSZip === 'undefined') throw new PptxStageError(stage, 'PPT 저장 라이브러리를 찾을 수 없습니다'); // 라이브러리 확인
    stage = 'PPT 생성'; // 단계 이동
    const pptx = new PptxGenJS(); // 인스턴스
    pptx.defineLayout({ name: 'CO_USLETTER', width: PAGE_W, height: PAGE_H }); // 25.517 × 19.05cm
    pptx.layout = 'CO_USLETTER'; // 적용
    pptx.author = '6Keys Weekly'; pptx.title = APP_TITLE; // 문서 정보
    pptx.theme = { headFontFace: FACE, bodyFontFace: FACE }; // 글꼴
    const specs = []; // 차트 명세
    slides.forEach(s => addSlideFromScene(pptx, s, specs)); // 쪽마다 슬라이드
    const raw = await pptx.write({ outputType: 'arraybuffer' }); // 바이너리 생성
    stage = '후처리'; // 단계 이동
    const zip = await JSZip.loadAsync(raw); // zip 열기
    await patchCharts(zip, specs); // ① 차트 교체
    await patchEmbeddedWorkbooks(zip); // ② 내장 엑셀 정리
    await injectMaster(zip); // ③ 마스터 삽입
    stage = '파일 만들기'; // 단계 이동
    return await zip.generateAsync({ type: 'blob', mimeType: 'application/vnd.openxmlformats-officedocument.presentationml.presentation', compression: 'DEFLATE' }); // Blob
  } catch (e) { // 실패
    console.error(e); // 기록
    const where = e instanceof PptxStageError ? e.stage : stage; // 실패 단계
    throw new Error('PPT 저장 중 [' + where + '] 단계에서 실패했습니다 : ' + (e.message || '알 수 없는 오류')); // 한글 안내
  }
}
function pad2(n) { return String(n).padStart(2, '0'); } // 두 자리 숫자
function pptxFileName(kind, nos) { // 파일명 규칙: 제목_S03 / 제목_S01-S03 / 제목_전체_S01-S07
  const title = APP_TITLE + '_' + weekShort(state.week); // 제목
  const sn = n => 'S' + pad2(n); // 쪽 표기
  if (kind === 'current') return title + '_' + sn(nos[0]) + '.pptx'; // 현재 쪽
  if (kind === 'all') return title + '_전체_' + sn(nos[0]) + '-' + sn(nos[nos.length - 1]) + '.pptx'; // 전체
  return title + '_' + sn(nos[0]) + (nos.length > 1 ? '-' + sn(nos[nos.length - 1]) : '') + '.pptx'; // 선택 쪽
}
function downloadBlob(blob, name) { // Blob 내려받기
  const a = document.createElement('a'); // 링크
  a.href = URL.createObjectURL(blob); a.download = name; // 주소·파일명
  document.body.appendChild(a); a.click(); // 클릭
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000); // 정리
}
async function savePptx(kind, selNos, separate) { // 저장 실행. kind: current/selected/all, separate: 쪽별 개별 파일
  const all = state.slides; // 전체 쪽
  let nos; // 대상 쪽 번호(1부터)
  if (kind === 'current') nos = [state.cur + 1]; // 현재 쪽
  else if (kind === 'all') nos = all.map((s, i) => i + 1); // 전체
  else nos = (selNos || []).slice().sort((a, b) => a - b); // 선택 쪽(번호순)
  if (!nos.length) { toast('저장할 쪽을 선택해 주세요'); return; } // 선택 없음
  toast('PPT를 만드는 중입니다…', 4000); // 진행 안내
  try { // 저장
    if (separate) { // 쪽별 개별 파일
      for (const n of nos) { downloadBlob(await buildPptxBlob([all[n - 1]]), pptxFileName('current', [n])); await new Promise(r => setTimeout(r, 400)); } // 한 쪽씩
      toast('PPT ' + nos.length + '개를 저장했습니다'); // 완료
    } else { // 한 파일
      const blob = await buildPptxBlob(nos.map(n => all[n - 1])); // 만들기
      downloadBlob(blob, pptxFileName(kind, nos)); // 내려받기
      toast('PPT를 저장했습니다 (' + nos.length + '장)'); // 완료
    }
  } catch (e) { toast(e.message, 6000); } // 한글 오류 토스트
}

// ============================================================================
// 05_app.js — 앱: 쪽 이동 · 전환 효과 · 단계 등장 · 전체화면 발표 · 발표 도구 · 관리자/편집 · 저장 · 초기화
// ============================================================================

// ───────────────────────── 1. 작은 도우미 ─────────────────────────
const $ = id => document.getElementById(id); // id 로 요소 찾기
const TRANS = ['fade', 'push', 'zoom', 'none']; // 전환 효과 목록(T 키 순환)
let lastDir = 1; // 마지막 이동 방향(밀기 전환용)
let numBuf = ''; // 숫자+Enter 이동용 입력 버퍼
let numTimer = 0; // 숫자 입력 시간 제한
let idleTimer = 0; // 마우스 정지 타이머
let coverMode = ''; // 가림 화면 상태('' / 'b' / 'w')
let laserOn = false; // 레이저 포인터 상태
let busy = false; // 불러오는 중 여부
function curSlide() { return state.slides[state.cur]; } // 현재 쪽
function stepNow() { return state.stepMode ? state.stepNo : 999; } // 현재 보여줄 단계(꺼져 있으면 전부)
function isTyping(t) { return !!t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable); } // 입력 칸 여부
function anyDirty() { return Object.keys(state.dirty).some(w => state.dirty[w]); } // 저장 안 된 수정 여부

// ───────────────────────── 2. 쪽 그리기·이동 ─────────────────────────
function renderCurrentInto(layer) { // 현재 쪽을 만들어 layer 에 붙인다
  const page = renderPage(curSlide(), { stepNo: stepNow(), edit: state.edit }); // 쪽 생성
  layer.appendChild(page); // 붙이기
  return page; // 반환
}
function updateChrome() { // 칩·진행 막대·쪽 번호·버튼 상태 갱신
  document.querySelectorAll('#pageChips .chip').forEach((b, i) => b.classList.toggle('cur', i === state.cur)); // 현재 칩
  const n = state.slides.length; // 쪽 수
  $('hudBar').style.width = n ? ((state.cur + 1) / n * 100).toFixed(1) + '%' : '0'; // 진행 막대
  $('hudNo').textContent = (state.cur + 1) + ' / ' + n; // 쪽 번호
  $('btnStep').textContent = '단계 등장: ' + (state.stepMode ? '켜짐' : '꺼짐'); // 단계 버튼
  $('btnStep').classList.toggle('on', state.stepMode); // 켜짐 표시
  $('btnEdit').classList.toggle('on', state.edit); // 편집 표시
  $('transSel').value = state.trans; // 전환 선택값
}
function showPage(idx, dir) { // idx 쪽으로 이동(전환 효과 적용). dir: 1 앞으로, -1 뒤로
  if (!state.slides.length) return; // 쪽이 없으면 무시
  idx = Math.max(0, Math.min(state.slides.length - 1, idx)); // 범위 보정
  const layer = $('pageLayer'); // 쪽 층
  const old = Array.from(layer.children); // 기존 쪽들
  const first = old.length === 0; // 처음 그리는지
  state.cur = idx; // 현재 쪽 갱신
  const d = dir || (lastDir || 1); // 방향
  lastDir = d; // 기억
  const page = renderCurrentInto(layer); // 새 쪽
  const tr = state.trans; // 전환 종류
  if (first || tr === 'none') { old.forEach(o => o.remove()); } // 즉시 교체
  else { // 전환 효과
    old.slice(0, -1).forEach(o => o.remove()); // 오래된 잔여 쪽 제거
    const prev = old[old.length - 1]; // 직전 쪽
    page.classList.add('t-' + tr); if (prev) prev.classList.add('t-' + tr); // 전환 클래스
    if (tr === 'fade') { page.style.opacity = '0'; } // 페이드 시작 상태
    if (tr === 'push') { page.style.transform = 'translateX(' + (100 * d) + '%)'; } // 밀기 시작 상태
    if (tr === 'zoom') { page.style.opacity = '0'; page.style.transform = 'scale(0.92)'; } // 확대 시작 상태
    void page.offsetWidth; // 강제 리플로우
    requestAnimationFrame(() => { // 다음 프레임에 도착 상태로
      page.style.opacity = '1'; page.style.transform = 'none'; // 새 쪽 도착
      if (prev) { // 이전 쪽 퇴장
        if (tr === 'fade') prev.style.opacity = '0'; // 사라짐
        if (tr === 'push') prev.style.transform = 'translateX(' + (-100 * d) + '%)'; // 밀려남
        if (tr === 'zoom') { prev.style.opacity = '0'; prev.style.transform = 'scale(1.06)'; } // 커지며 사라짐
      }
    });
    setTimeout(() => { if (prev && prev.parentNode) prev.remove(); }, 600); // 전환 끝나면 제거
  }
  updateChrome(); // 칩·막대 갱신
  const ov = checkTableOverlap(page, curSlide()); // 표 겹침 검사
  if (ov.length) console.warn(ov.join('\n')); // 개발자 도구 기록
}
function reRender() { // 같은 쪽을 전환 없이 다시 그림(편집·단계 변경 후)
  const layer = $('pageLayer'); // 쪽 층
  layer.innerHTML = ''; // 비우기
  const page = renderCurrentInto(layer); // 다시 그리기
  updateChrome(); // 갱신
  return page; // 반환
}
function revealSteps() { // 현재 단계까지 요소를 나타낸다(애니메이션)
  document.querySelectorAll('#pageLayer .el').forEach(d => { d.classList.toggle('step-hide', parseInt(d.dataset.s || '0', 10) > stepNow()); }); // 단계 비교
}
function goNext() { // 다음(단계가 남아 있으면 단계부터)
  const s = curSlide(); if (!s) return; // 쪽 없음
  if (state.stepMode && state.stepNo < s.steps) { state.stepNo++; revealSteps(); return; } // 단계 등장
  if (state.cur < state.slides.length - 1) { state.stepNo = 0; showPage(state.cur + 1, 1); } // 다음 쪽
  else toast('마지막 쪽입니다', 1200); // 끝
}
function goPrev() { // 이전(단계가 켜져 있으면 단계부터 되돌림)
  if (state.stepMode && state.stepNo > 0) { state.stepNo--; revealSteps(); return; } // 단계 되돌리기
  if (state.cur > 0) { state.stepNo = state.stepMode ? state.slides[state.cur - 1].steps : 0; showPage(state.cur - 1, -1); } // 이전 쪽(전부 보이는 상태)
  else toast('첫 쪽입니다', 1200); // 처음
}
function gotoPage(i) { // 특정 쪽으로 이동
  if (i === state.cur) return; // 같은 쪽
  state.stepNo = 0; showPage(i, i > state.cur ? 1 : -1); // 이동
}
function buildChips() { // 쪽 이동 칩 만들기
  const box = $('pageChips'); box.innerHTML = ''; // 비우기
  state.slides.forEach((s, i) => { // 쪽마다
    const b = document.createElement('button'); b.className = 'chip'; b.textContent = String(i + 1); b.title = 'S' + pad2(i + 1) + ' ' + s.name; // 칩
    b.onclick = () => gotoPage(i); // 이동
    box.appendChild(b); // 추가
  });
}
function rebuildSlides(keepCur) { // 자료가 바뀌었을 때 장면을 다시 만들고 현재 쪽 유지
  const wk = state.cache[state.week]; if (!wk) return; // 자료 없음
  const cur = state.cur; // 현재 쪽 기억
  state.slides = buildSlides(state.win.map(w => state.cache[w.week] || w), wk); // 장면 재생성
  state.win = state.win.map(w => state.cache[w.week] || w); // 창 갱신
  buildChips(); // 칩
  state.cur = keepCur ? Math.min(cur, state.slides.length - 1) : 0; // 쪽 유지
  const warns = []; state.slides.forEach(s => s.warn.forEach(w => warns.push(w))); // 경고 모으기
  if (warns.length) { console.warn(warns.join('\n')); toast('주의 : ' + warns[0] + (warns.length > 1 ? ' 외 ' + (warns.length - 1) + '건' : ''), 5000); } // 글 넘침 안내
}

// ───────────────────────── 3. 주차 불러오기 ─────────────────────────
function fillWeekSelect() { // 주차 선택 상자 채우기(최신이 위)
  const sel = $('weekSel'); sel.innerHTML = ''; // 비우기
  state.weeks.slice().reverse().forEach(w => { const o = document.createElement('option'); o.value = w; o.textContent = weekLabel(w) + (state.dirty[w] ? ' *' : ''); sel.appendChild(o); }); // 옵션
  sel.value = state.week; // 선택값
}
async function loadWeek(week, keepPage) { // 주차를 불러와 화면에 표시
  if (busy) return; busy = true; // 중복 방지
  try { // 오류 안내
    state.week = week; // 선택 주차
    state.win = await loadWindow(week, 6); // 최근 6주
    if (!state.win.length || state.win[state.win.length - 1].week !== week) throw new Error('데이터 형식이 올바르지 않습니다 (' + week + ')'); // 검증
    rebuildSlides(!!keepPage); // 장면 생성
    state.stepNo = 0; // 단계 초기화
    $('pageLayer').innerHTML = ''; // 층 비우기
    showPage(state.cur, 1); // 표시
    fillWeekSelect(); // 주차 상자
  } catch (e) { console.error(e); toast(e.message || '데이터를 불러오지 못했습니다', 5000); } // 한글 안내
  busy = false; // 해제
}
async function refreshFromSheet(silent) { // 시트에서 최신 자료를 받아와 병합(백그라운드)
  const weeks = await loadWeekList(); // 주차 목록(시트 + 내장)
  if (weeks.length) { state.weeks = weeks; fillWeekSelect(); } // 목록 갱신
  if (!state.sheetOk) { if (!silent) toast('시트에 연결하지 못해 내장 자료로 표시합니다 (오프라인 가능)', 3500); return false; } // 시트 실패 안내
  const target = state.week; // 현재 주차
  const keep = state.dirty[target]; // 수정 중인지
  if (!keep) { // 수정 중이 아니면 시트 자료로 갱신
    const slice = state.weeks.slice(Math.max(0, state.weeks.indexOf(target) - 5), state.weeks.indexOf(target) + 1); // 6주
    slice.forEach(w => { delete state.cache[w]; }); // 캐시 비우기
    await loadWeek(target, true); // 다시 표시
  }
  if (!silent) toast('시트 자료를 불러왔습니다'); // 완료
  return true; // 성공
}

// ───────────────────────── 4. 전체화면 발표 ─────────────────────────
function enterPresent() { // 발표 시작
  if (state.present) return; // 이미 발표 중
  state.present = true; // 상태
  document.body.classList.add('present'); // 막대 숨김
  const el = document.documentElement; // 전체화면 대상
  const req = el.requestFullscreen || el.webkitRequestFullscreen; // Fullscreen API
  if (req) { Promise.resolve(req.call(el)).catch(() => { toast('창 안에서 발표 모드로 표시합니다. F11 키로 전체화면을 켤 수 있습니다', 4000); }); } // 차단되면 안내 후 창 모드
  else toast('창 안에서 발표 모드로 표시합니다. F11 키로 전체화면을 켤 수 있습니다', 4000); // 미지원
  setTimeout(fitStage, 80); // 배율 맞춤
  toast('→ 다음 · ← 이전 · B 검은 화면 · W 흰 화면 · L 레이저 · O 목차 · S 단계 · T 전환 · Esc 종료', 4500); // 단축키 안내
  resetIdle(); // 커서 숨김 타이머
}
function exitPresent() { // 발표 종료
  if (!state.present) return; // 발표 중 아님
  state.present = false; // 상태

// ───────────────────────── 5. 키보드·마우스·터치 ─────────────────────────
function onKey(e) { // 키 입력 처리 (입력 칸에 커서가 있으면 동작하지 않음)
  if (isTyping(e.target)) return; // 입력 중
  if (document.querySelector('#modalRoot .mask')) return; // 모달이 열려 있으면 무시
  const k = e.key; // 키
  if (e.ctrlKey || e.metaKey || e.altKey) return; // 조합키는 브라우저에 맡김
  if (k === 'F5' || k === 'f' || k === 'F') { e.preventDefault(); togglePresent(); return; } // 발표
  if (k === 'Escape') { if ($('overview').classList.contains('on')) closeOverview(); else if (coverMode) setCover(''); else if (state.present) exitPresent(); return; } // Esc
  if (/^[0-9]$/.test(k)) { numBuf += k; clearTimeout(numTimer); numTimer = setTimeout(() => { numBuf = ''; }, 2500); toast('이동 : ' + numBuf + ' (Enter)', 1200); return; } // 숫자 입력
  if (k === 'Enter' && numBuf) { const n = parseInt(numBuf, 10); numBuf = ''; if (n >= 1 && n <= state.slides.length) gotoPage(n - 1); else toast('1~' + state.slides.length + ' 사이의 쪽 번호를 입력해 주세요'); return; } // 번호 이동
  if (coverMode && (k === 'b' || k === 'B' || k === 'w' || k === 'W')) { setCover(coverMode === (k.toLowerCase()) ? '' : k.toLowerCase()); return; } // 가림 토글
  if (['ArrowRight', 'ArrowDown', 'PageDown', ' ', 'Enter', 'n', 'N'].includes(k)) { e.preventDefault(); if (coverMode) setCover(''); else goNext(); return; } // 다음
  if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace', 'p', 'P'].includes(k)) { e.preventDefault(); if (coverMode) setCover(''); else goPrev(); return; } // 이전
  if (k === 'Home') { e.preventDefault(); gotoPage(0); return; } // 처음
  if (k === 'End') { e.preventDefault(); gotoPage(state.slides.length - 1); return; } // 끝
  if (k === 'b' || k === 'B') { setCover('b'); return; } // 검은 화면
  if (k === 'w' || k === 'W') { setCover('w'); return; } // 흰 화면
  if (k === 'l' || k === 'L') { toggleLaser(); return; } // 레이저
  if (k === 'o' || k === 'O') { toggleOverview(); return; } // 목차
  if (k === 's' || k === 'S') { toggleStep(); return; } // 단계 등장
  if (k === 't' || k === 'T') { cycleTrans(); return; } // 전환 효과
  if ((k === 'e' || k === 'E') && state.admin) { toggleEdit(); return; } // 편집(관리자)
}
function onViewportClick(e) { // 클릭 이동 (발표 중에만) + 요약표 행 이동
  const tr = e.target.closest && e.target.closest('tr[data-go]'); // 요약표 행
  if (tr && !state.edit) { gotoPage(parseInt(tr.dataset.go, 10)); return; } // 품목 쪽으로 이동
  if (!state.present || state.edit || coverMode) return; // 발표 중이 아니면 무시
  if (e.target.closest('#overview')) return; // 목차 클릭은 별도 처리
  const r = $('viewport').getBoundingClientRect(); // 영역
  if (e.clientX - r.left < r.width * 0.2) goPrev(); else goNext(); // 왼쪽 20% 이전, 그 외 다음
}
function onMouseMove(e) { // 레이저·커서 숨김 처리
  if (state.present) resetIdle(); // 커서 표시
  if (laserOn) { const r = $('viewport').getBoundingClientRect(); const L = $('laser'); L.style.left = (e.clientX - r.left) + 'px'; L.style.top = (e.clientY - r.top) + 'px'; } // 레이저 위치
}
let touchX = null; // 터치 시작 x
function initInput() { // 입력 이벤트 연결
  document.addEventListener('keydown', onKey); // 키보드
  $('viewport').addEventListener('click', onViewportClick); // 클릭
  $('viewport').addEventListener('contextmenu', e => { if (state.present) { e.preventDefault(); goPrev(); } }); // 오른쪽 클릭 = 이전
  document.addEventListener('mousemove', onMouseMove); // 마우스 이동
  $('viewport').addEventListener('touchstart', e => { touchX = e.touches[0].clientX; }, { passive: true }); // 터치 시작
  $('viewport').addEventListener('touchend', e => { // 터치 끝: 스와이프
    if (touchX === null) return; const dx = e.changedTouches[0].clientX - touchX; touchX = null; // 이동량
    if (Math.abs(dx) > 50) { dx < 0 ? goNext() : goPrev(); } // 왼쪽으로 밀면 다음
  });
  window.addEventListener('resize', fitStage); // 창 크기
  document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && state.present && !document.body.dataset.winPresent) exitPresent(); setTimeout(fitStage, 80); }); // 전체화면 해제 시 종료
  window.addEventListener('beforeunload', e => { if (anyDirty()) { e.preventDefault(); e.returnValue = ''; } }); // 저장 안 된 수정 경고
}

// ───────────────────────── 7-2. PDF 전체 저장 (회사 용지, 한 파일) ─────────────────────────
// 쪽을 2400×1791px 그림(JPEG)으로 찍어 PDF 한 페이지씩에 넣는다. 외부 라이브러리 없이 PDF 를 직접 조립한다.
// 그림 방식이라 PDF 안의 글자는 선택·검색되지 않는다(편집이 필요하면 PPT 저장을 사용).
function pdfBuild(pages, pw, ph) { // pages:[{bytes,w,h}] → PDF Uint8Array (pw/ph 는 pt)
  const enc = new TextEncoder(), parts = [], offs = []; // 글자 변환기, 조각 목록, 개체별 시작 위치
  let pos = 0; // 지금까지 쓴 바이트 수
  const put = u8 => { parts.push(u8); pos += u8.length; }; // 바이트 추가
  const txt = t => put(enc.encode(t)); // 글자 추가
  const obj = (n, head, body) => { // 개체 1개 기록(body 가 있으면 stream 으로)
    offs[n] = pos; txt(n + ' 0 obj\n' + head);
    if (body) { txt('\nstream\n'); put(body); txt('\nendstream'); }
    txt('\nendobj\n');
  };
  txt('%PDF-1.4\n%\u00e2\u00e3\u00cf\u00d3\n'); // 머리말
  obj(1, '<< /Type /Catalog /Pages 2 0 R >>'); // 문서 루트
  obj(2, '<< /Type /Pages /Count ' + pages.length + ' /Kids [' + pages.map((_, i) => (3 + i * 3) + ' 0 R').join(' ') + '] >>'); // 쪽 목록
  pages.forEach((g, i) => {
    const pg = 3 + i * 3, ct = pg + 1, im = pg + 2; // 쪽 / 내용 / 그림 개체 번호
    obj(pg, '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + pw.toFixed(2) + ' ' + ph.toFixed(2) + '] /Resources << /XObject << /Im0 ' + im + ' 0 R >> >> /Contents ' + ct + ' 0 R >>');
    const draw = enc.encode('q ' + pw.toFixed(2) + ' 0 0 ' + ph.toFixed(2) + ' 0 0 cm /Im0 Do Q'); // 그림을 쪽 전체에 맞춰 그림
    obj(ct, '<< /Length ' + draw.length + ' >>', draw);
    obj(im, '<< /Type /XObject /Subtype /Image /Width ' + g.w + ' /Height ' + g.h + ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + g.bytes.length + ' >>', g.bytes);
  });
  const n = 3 + pages.length * 3, xr = pos; // 개체 수, xref 시작 위치
  let x = 'xref\n0 ' + n + '\n0000000000 65535 f \n';
  for (let k = 1; k < n; k++) x += String(offs[k]).padStart(10, '0') + ' 00000 n \n';
  txt(x + 'trailer\n<< /Size ' + n + ' /Root 1 0 R >>\nstartxref\n' + xr + '\n%%EOF\n');
  const out = new Uint8Array(pos); let o = 0; // 한 덩어리로 합치기
  parts.forEach(u => { out.set(u, o); o += u.length; });
  return out;
}
async function savePdfAll() { // 전체 쪽 → PDF 1개
  const all = state.slides; // 전체 쪽
  let stage = '준비'; // 실패 단계 안내용
  try {
    const pages = []; // 쪽별 JPEG
    for (let i = 0; i < all.length; i++) {
      stage = '쪽 그림 만들기 ' + (i + 1) + '/' + all.length;
      toast('PDF 만드는 중 ' + (i + 1) + '/' + all.length + ' …', 4000);
      const b = await slideToPngBlob(all[i], 2400, 1791, 'image/jpeg', 0.92); // 회사 용지 비율 JPEG
      pages.push({ bytes: new Uint8Array(await b.arrayBuffer()), w: 2400, h: 1791 });
    }
    stage = 'PDF 조립';
    const pdf = pdfBuild(pages, PAGE_W * 72, PAGE_H * 72); // 1in = 72pt
    stage = '다운로드';
    downloadBlob(new Blob([pdf], { type: 'application/pdf' }), pptxFileName('all', all.map((s, i) => i + 1)).replace(/\.pptx$/, '.pdf'));
    toast('PDF를 저장했습니다 (' + all.length + '쪽)');
  } catch (e) { toast('PDF 저장 중 [' + stage + '] 단계에서 실패했습니다 : ' + (e.message || '알 수 없는 오류'), 6000); } // 한글 오류
}
async function savePngs(scope, sel) { // PNG 저장(현재/선택/전체)
  const nos = scope === 'current' ? [state.cur + 1] : (scope === 'all' ? state.slides.map((s, i) => i + 1) : sel.slice().sort((a, b) => a - b)); // 대상 쪽

  toast('이미지를 만드는 중입니다…', 3000); // 진행 안내
  try { // 변환
    for (const n of nos) { const b = await slideToPngBlob(state.slides[n - 1]); downloadBlob(b, APP_TITLE + '_' + weekShort(state.week) + '_S' + pad2(n) + '.png'); await new Promise(r => setTimeout(r, 350)); } // 한 장씩
    toast('PNG ' + nos.length + '장을 저장했습니다'); // 완료
  } catch (e) { toast(e.message, 5000); } // 한글 오류
}
async function copyImage() { // 현재 쪽 이미지를 클립보드로 복사

function syncStored(it) { // 가격이 바뀌면 저장용 증감값도 다시 계산
  const p = num(it.price), q = num(it.prev_price); // 현재가·전주가
  if (isFinite(p) && isFinite(q)) { it.change_abs = Math.round((p - q) * 100) / 100; it.change_pct = q !== 0 ? Math.round((p - q) / q * 10000) / 100 : 0; } // 재계산
}
function rawOf(bind, el) { // 편집창에 보여줄 원문
  if (bind.kind === 'week') { const wk = state.cache[state.week]; return wk.summary_headline || plainHeadline(el); } // 요약 메시지
  const it = state.cache[state.week].items[bind.key]; // 품목
  if (bind.field === 'headline') return it.headline || plainHeadline(el); // 핵심 메시지
  const v = it[bind.field]; // 필드 값
  if (bind.list) return lines(v).map(l => '- ' + l).join('\n'); // 목록은 "- " 로 시작
  return v === undefined || v === null ? '' : String(v); // 문자열
}
function plainHeadline(el) { // 자동 핵심 메시지에서 "□ " 를 뺀 평문
  if (!el || !el.paras) return ''; // 없으면 빈 문자열
  return el.paras[0].runs.map(r => r.t).join('').replace(/^□\s*/, ''); // 연결
}
function commitEdit(bind, text) { // 편집 확정: 검증 → 자료 반영 → 합계/그래프 자동 갱신
  const wk = state.cache[state.week]; // 주차 자료
  if (bind.kind === 'week') { wk.summary_headline = text.trim(); } // 요약 메시지
  else { // 품목 필드
    const it = wk.items[bind.key]; // 품목
    if (bind.numeric) { // 숫자 칸
      const t = text.trim().replace(/,/g, ''); // 쉼표 제거
      if (t !== '' && (!/^\d+(\.\d+)?$/.test(t))) { toast('0 이상의 숫자만 입력할 수 있습니다', 3000); return false; } // 문자·음수 거부
      it[bind.field] = t === '' ? '' : parseFloat(t); // 숫자 저장
      syncStored(it); // 증감값 재계산
    } else if (bind.list) { // 목록 칸
      it[bind.field] = text.split(/\n+/).map(l => l.replace(/^\s*[-•·▪]\s*/, '').trim()).filter(Boolean).map(l => '- ' + l).join('\n'); // "- " 형식 저장
    } else { it[bind.field] = text.trim() === '(내용 없음)' ? '' : text.trim(); } // 문자열
  }
  state.dirty[state.week] = true; // 수정 표시
  fillWeekSelect(); // 주차 상자에 * 표시
  return true; // 성공
}
function editTargetOf(node) { // 실제로 편집할 DOM 요소
  if (node.classList.contains('p') || node.tagName === 'TD') return node; // 문단·셀
  return node.querySelector('.in') || node; // 요소 전체
}
function onEditClick(e) { // 편집 모드에서 점선 칸 클릭
  if (!state.edit) return; // 편집 모드 아님
  const node = e.target.closest('.editable'); // 점선 칸
  if (!node || node._editing) return; // 없거나 이미 편집 중
  const bind = node._bind; if (!bind) return; // 연결 정보 없음
  const host = node.closest('.el'); const el = host ? host._el : null; // 장면 요소
  const tgt = editTargetOf(node); // 편집 대상
  const raw = rawOf(bind, el); // 원문
  node._editing = true; tgt.textContent = raw; tgt.contentEditable = 'true'; tgt.style.whiteSpace = 'pre-wrap'; tgt.focus(); // 편집 시작
  const sel = window.getSelection(); const rg = document.createRange(); rg.selectNodeContents(tgt); sel.removeAllRanges(); sel.addRange(rg); // 전체 선택
  let done = false; // 중복 방지
  const finish = (save) => { // 편집 종료
    if (done) return; done = true; // 한 번만
    const text = tgt.innerText.replace(/​/g, ''); // 입력 내용
    tgt.contentEditable = 'false'; node._editing = false; // 편집 해제
    if (save) { const ok = commitEdit(bind, text); rebuildSlides(true); reRender(); if (ok) toast('수정 내용을 반영했습니다 (합계·그래프 자동 갱신)', 1800); } // 반영
    else { rebuildSlides(true); reRender(); } // 취소/오류 시 원래 값으로 되돌림
  };
  tgt.addEventListener('keydown', ev => { // Enter 확정 / Shift+Enter 줄바꿈 / Esc 취소
    ev.stopPropagation(); // 발표 단축키와 분리
    if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); finish(true); } // 확정
    else if (ev.key === 'Escape') { ev.preventDefault(); finish(false); } // 취소
  });
  tgt.addEventListener('blur', () => finish(true)); // 포커스를 잃으면 확정
}
function toggleEdit() { // 편집 모드 켜고 끄기
  if (!state.admin) { toast('관리자 모드에서만 편집할 수 있습니다'); return; } // 권한
  state.edit = !state.edit; // 토글
  reRender(); // 다시 그리기
  toast(state.edit ? '편집 모드 : 점선 칸을 눌러 수정 · Enter 확정 · Shift+Enter 줄바꿈 · Esc 취소' : '편집 모드 종료', 2800); // 안내
}

// ───────────────────────── 10. 품목 입력 창 · 새 주차 · 저장 · JSON ─────────────────────────
function dailyToText(arr) { return (arr || []).map(x => x.date + ', ' + x.price).join('\n'); } // 일간 가격 → 텍스트

    '<div class="hint">저장 시 증감액·증감률은 현재가·전주 가격으로 자동 계산됩니다. 숫자 칸에는 0 이상의 숫자만 입력할 수 있습니다.</div>' +
    '<div class="btns"><button id="imCancel">취소</button><button class="pri" id="imOk">적용</button></div>', dlg => {

      dlg.querySelector('#imComm').value = it.commentary; dlg.querySelector('#imFact').value = it.factors; dlg.querySelector('#imOut').value = it.outlook; // 글
      dlg.querySelector('#imAdd').value = it.additional_info; dlg.querySelector('#imAi').value = it.ai_outlook; dlg.querySelector('#imDaily').value = dailyToText(it.daily_prices); // 글
    };

    dlg.querySelector('#imOk').onclick = () => { // 적용
      const it = wk.items[dlg.querySelector('#imKey').value]; // 품목
      const price = dlg.querySelector('#imPrice').value.trim().replace(/,/g, ''), prev = dlg.querySelector('#imPrev').value.trim().replace(/,/g, ''); // 숫자 칸
      if ((price !== '' && !/^\d+(\.\d+)?$/.test(price)) || (prev !== '' && !/^\d+(\.\d+)?$/.test(prev))) { toast('0 이상의 숫자만 입력할 수 있습니다', 3000); return; } // 검증
      const daily = normalizeDaily(dlg.querySelector('#imDaily').value); // 일간 가격
      it.price = price === '' ? '' : parseFloat(price); it.prev_price = prev === '' ? '' : parseFloat(prev); // 숫자
      it.headline = dlg.querySelector('#imHead').value.trim(); it.commentary = dlg.querySelector('#imComm').value.trim(); // 글

      it.additional_info = dlg.querySelector('#imAdd').value.trim(); it.ai_outlook = dlg.querySelector('#imAi').value.trim(); it.daily_prices = daily; // 글
      syncStored(it); state.dirty[state.week] = true; closeModal(); fillWeekSelect(); rebuildSlides(true); reRender(); toast('품목 내용을 반영했습니다'); // 반영
    };

}
function newWeekModal() { // 새 주차 만들기
  const last = state.weeks[state.weeks.length - 1]; const p = weekParts(last); // 마지막 주차
  const next = p ? p.y + '-W' + pad2(p.n + 1) : ''; // 다음 주차 제안
  openModal('<h3>새 주차 추가</h3><label>주차 (예 2026-W46)</label><input id="nwWeek" value="' + next + '"><div class="hint">직전 주차의 가격이 "전주 가격"으로 복사되고 나머지는 비어 있습니다. 추가 후 편집(E) 또는 품목 입력으로 채우세요.</div><div class="btns"><button id="nwCancel">취소</button><button class="pri" id="nwOk">추가</button></div>', dlg => {
    dlg.querySelector('#nwCancel').onclick = closeModal; // 취소
    dlg.querySelector('#nwOk').onclick = async () => { // 추가
      const w = dlg.querySelector('#nwWeek').value.trim().toUpperCase(); // 입력
      if (!weekParts(w)) { toast('주차 형식이 올바르지 않습니다 (예 2026-W46)'); return; } // 형식 검사
      if (state.weeks.includes(w)) { toast('이미 있는 주차입니다'); return; } // 중복
      const prevWk = state.cache[last] || await fetchWeek(last); // 직전 주차 자료
      const items = {}; ITEMS.forEach(m => { items[m.key] = { price: '', prev_price: prevWk ? prevWk.items[m.key].price : '', commentary: '', factors: '', outlook: '', additional_info: '', ai_outlook: '', daily_prices: [] }; }); // 빈 품목

async function saveToSheet() { // 시트 저장 (saveEntry)
  const w = state.week; const wk = state.cache[w]; // 주차 자료

  ITEMS.forEach(m => syncStored(wk.items[m.key])); // 증감값 동기화
  toast('시트에 저장하는 중입니다…', 4000); // 진행 안내
  const ok = await saveWeekToSheet(w); // 저장
  if (ok) { state.dirty[w] = false; fillWeekSelect(); toast('시트에 저장했습니다'); } // 성공
  else toast('시트 저장에 실패했습니다. 네트워크·권한을 확인하거나 [JSON]으로 내려받아 보관해 주세요', 6000); // 한글 안내
}
function downloadJson() { // 현재 주차 JSON 내려받기
  const wk = state.cache[state.week]; if (!wk) return; // 없음
  ITEMS.forEach(m => syncStored(wk.items[m.key])); // 동기화
  downloadBlob(new Blob([JSON.stringify(wk, null, 2)], { type: 'application/json' }), 'w' + pad2(weekParts(state.week).n) + '-' + state.week + '.json'); // 내려받기
  toast('JSON 파일을 내려받았습니다'); // 완료
}
async function reloadFromSheet() { // 시트에서 다시 불러오기

  state.dirty = {}; state.cache = {}; // 초기화
  await refreshFromSheet(false); await loadWeek(state.week, true); // 다시 표시
}

async function init() { // 앱 시작: 내장 자료로 즉시 표시 → 백그라운드로 시트 병합
  try { // 오류 안내
    drawMaster(); fitStage(); bindButtons(); initInput(); // 화면 준비
    state.weeks = Object.keys(SEED).filter(w => weekParts(w)).sort(); // 내장 주차 목록
    if (!state.weeks.length) throw new Error('내장 데이터를 찾을 수 없습니다'); // 검증
    state.week = state.weeks[state.weeks.length - 1]; // 가장 최근 주차
    fillWeekSelect(); // 주차 상자
    state.offline = true; await loadWeek(state.week, false); state.offline = false; // 내장 자료로 바로 슬라이드 화면(시트 대기 없음)
    try { if (sessionStorage.getItem('k6admin') === '1') setAdmin(true); } catch (_) { } // 같은 탭이면 관리자 유지
    refreshFromSheet(true).then(ok => { if (ok) toast('구글 시트와 연결되었습니다', 1800); }); // 백그라운드 시트 병합
  } catch (e) { console.error(e); toast(e.message || '앱을 시작하지 못했습니다', 6000); } // 한글 안내
}
window.__app = { state, init, showPage, gotoPage, goNext, goPrev, loadWeek, rebuildSlides, reRender, renderPage, buildSlides, buildPptxBlob, savePptx, slideToPngBlob, enterPresent, exitPresent, toggleStep, toggleEdit, setAdmin, commitEdit, setCover, cycleTrans, openOverview, closeOverview, onKey, measureH, itemStats }; // 검증용 공개 함수
