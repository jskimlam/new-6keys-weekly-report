<div id="bar"><!-- 상단 조작 막대(발표 중에는 숨김) -->

  <label class="grp">주차 <select id="weekSel" title="주차 아카이브"></select></label><!-- 주차 선택 -->
  <span class="grp" id="pageChips"></span><!-- 쪽 이동 칩 -->
  <button id="btnPrev" title="이전 (←)">◀</button><!-- 이전 쪽 -->
  <button id="btnNext" title="다음 (→)">▶</button><!-- 다음 쪽 -->
  <button id="btnPresent" class="pri" title="전체화면 발표 (F5 / F)">▶ 발표(F5)</button><!-- 발표 시작 -->
  <label class="grp">전환 <select id="transSel"><option value="fade">페이드</option><option value="push">밀기</option><option value="zoom">확대</option><option value="none">없음</option></select></label><!-- 전환 효과 -->
  <button id="btnStep" title="단계 등장 (S)">단계 등장: 꺼짐</button><!-- 단계 등장 토글 -->
  <button id="btnOv" title="목차 (O)">목차</button><!-- 목차 -->
  <button id="btnPng" title="현재 쪽 PNG 저장">PNG</button><!-- PNG 저장 -->
  <button id="btnCopy" title="현재 쪽 이미지 복사">이미지 복사</button><!-- 이미지 복사 -->
  <button id="btnPptx" class="pri2" title="PPT 저장">PPT 저장</button><!-- PPT 저장 -->
  <button id="btnPdf" title="전체 쪽을 PDF 한 파일로 저장 (회사 용지 25.517×19.05cm)">PDF 전체 저장</button><!-- PDF 전체 저장 -->

  <span id="adminGrp" class="grp adm" hidden><!-- 관리자 전용 도구(잠금 해제 후 표시) -->

    <button id="btnItem" title="선택 품목 입력 창">품목 입력</button><!-- 품목 입력 창 -->
    <button id="btnSave" class="pri" title="시트에 저장">시트 저장</button><!-- 시트(GAS) 저장 -->
    <button id="btnNewWeek" title="새 주차 추가">새 주차</button><!-- 새 주차 -->
    <button id="btnJson" title="이 주차 JSON 내려받기">JSON</button><!-- JSON 내보내기 -->
    <button id="btnReload" title="시트에서 다시 불러오기">새로고침</button><!-- 다시 불러오기 -->

  <button id="btnAdmin" title="관리자 모드">🔒 관리자</button><!-- 관리자 잠금/해제 -->

<div id="viewport"><!-- 슬라이드를 담는 영역 -->

    <div id="pageLayer"></div><!-- 쪽 본문(전환 대상) -->
    <div id="masterLayer"></div><!-- 마스터(구분선·장식, 전환 중에도 고정) -->
  </div>
  <div id="cover"></div><!-- B/W 화면 가리개 -->
  <div id="laser"></div><!-- 레이저 포인터 -->
  <div id="overview"></div><!-- 목차(쪽 카드) -->
  <div id="hud"><div id="hudBar"></div><span id="hudNo"></span></div><!-- 진행 막대·쪽 번호 -->
</div>
